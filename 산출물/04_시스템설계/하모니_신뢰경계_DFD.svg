<svg viewBox="0 0 1480 1000" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1E293B"/></marker>
    <marker id="arwSoft" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/></marker>
    <marker id="arwRisk" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/></marker>
    <filter id="cardSh" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="0" y="0" width="1480" height="1000" fill="#FFFFFF"/>

  <!-- Title block -->
  <text x="48" y="56" font-size="26" font-weight="700" fill="#0F172A">하모니 · 신뢰경계 데이터 흐름 (DFD)</text>
  <text x="48" y="82" font-size="14" fill="#475569">외부 엔티티 □ · 프로세스 ○ · 데이터스토어 ▭ — 인증 없음, code=capability(약한 식별). 솔로 연주는 경계 밖에서 완결(서버 미도달).</text>

  <!-- ============ Trust boundary 1: 인터넷 ============ -->
  <rect x="48" y="120" width="1384" height="560" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="68" y="146" font-size="15" font-weight="700" fill="#475569">신뢰경계 ① 인터넷 (신뢰 없음 · 익명)</text>

  <!-- ============ Trust boundary 2: EC2 / 443 면 ============ -->
  <rect x="372" y="170" width="1036" height="476" rx="14" fill="#F1FBF5" stroke="#1A8754" stroke-width="1.6" stroke-dasharray="8 5"/>
  <g><rect x="372" y="170" width="318" height="28" rx="0" fill="#1A8754"/>
     <text x="386" y="189" font-size="13" font-weight="700" fill="#FFFFFF">신뢰경계 ② EC2 공개면 (TLS 443 종단)</text></g>

  <!-- ============ Trust boundary 3: localhost / 8080·DB ============ -->
  <rect x="760" y="220" width="588" height="372" rx="14" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="1.6" stroke-dasharray="8 5"/>
  <g><rect x="760" y="220" width="340" height="28" rx="0" fill="#232F3E"/>
     <text x="774" y="239" font-size="13" font-weight="700" fill="#FFFFFF">신뢰경계 ③ localhost (127.0.0.1:8080 · DB)</text></g>

  <!-- ===== 외부 엔티티: 기기/사용자 (square) ===== -->
  <g>
    <rect x="96" y="300" width="212" height="120" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="2" filter="url(#cardSh)"/>
    <svg x="116" y="322" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0EA5E9" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4.2" ry="9"/><path d="M3.2 12h17.6M4.4 7.5h15.2M4.4 16.5h15.2"/></svg>
    <text x="166" y="340" font-size="14" font-weight="700" fill="#0F172A">기기 / 사용자</text>
    <text x="166" y="360" font-size="11" fill="#64748B">토스 WebView · React 미니앱</text>
    <line x1="112" y1="380" x2="292" y2="380" stroke="#E2E8F0" stroke-width="1"/>
    <text x="116" y="398" font-size="11" fill="#334155">외부 엔티티 □ · 익명(인증 없음)</text>
    <text x="116" y="413" font-size="11" fill="#334155">보유: 익명키(약한 식별) · code</text>
  </g>

  <!-- ===== 프로세스 1: nginx (circle) ===== -->
  <g>
    <circle cx="528" cy="360" r="78" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#cardSh)"/>
    <svg x="500" y="296" width="38" height="38" viewBox="0 0 24 24"><path fill="#009639" d="M12 0L1.605 6v12L12 24l10.395-6V6L12 0zm6 16.59c0 .705-.646 1.29-1.529 1.29-.631 0-1.351-.255-1.801-.81l-6-7.141v6.66c0 .721-.57 1.29-1.274 1.29H7.32c-.721 0-1.29-.6-1.29-1.29V7.41c0-.705.63-1.29 1.5-1.29.646 0 1.38.255 1.83.81l5.97 7.141V7.41c0-.721.6-1.29 1.29-1.29h.075c.72 0 1.29.6 1.29 1.29v9.18H18z"/></svg>
    <text x="528" y="356" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">P1 · nginx</text>
    <text x="528" y="375" font-size="11" fill="#64748B" text-anchor="middle">TLS 종단 · 리버스프록시</text>
    <text x="528" y="391" font-size="11" fill="#64748B" text-anchor="middle">XFF 덮어쓰기(스푸프 차단)</text>
  </g>

  <!-- ===== 프로세스 2: node API (circle) ===== -->
  <g>
    <circle cx="912" cy="360" r="80" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#cardSh)"/>
    <svg x="884" y="296" width="38" height="38" viewBox="0 0 24 24"><path fill="#5FA04E" d="M11.998,24c-0.321,0-0.641-0.084-0.922-0.247l-2.936-1.737c-0.438-0.245-0.224-0.332-0.08-0.383 c0.585-0.203,0.703-0.25,1.328-0.604c0.065-0.037,0.151-0.023,0.218,0.017l2.256,1.339c0.082,0.045,0.197,0.045,0.272,0l8.795-5.076 c0.082-0.047,0.134-0.141,0.134-0.238V6.921c0-0.099-0.053-0.192-0.137-0.242l-8.791-5.072c-0.081-0.047-0.189-0.047-0.271,0 L3.075,6.68C2.99,6.729,2.936,6.825,2.936,6.921v10.15c0,0.097,0.054,0.189,0.139,0.235l2.409,1.392 c1.307,0.654,2.108-0.116,2.108-0.89V7.787c0-0.142,0.114-0.253,0.256-0.253h1.115c0.139,0,0.255,0.112,0.255,0.253v10.021 c0,1.745-0.95,2.745-2.604,2.745c-0.508,0-0.909,0-2.026-0.551L2.28,18.675c-0.57-0.329-0.922-0.945-0.922-1.604V6.921 c0-0.659,0.353-1.275,0.922-1.603l8.795-5.082c0.557-0.315,1.296-0.315,1.848,0l8.794,5.082c0.57,0.329,0.924,0.944,0.924,1.603 v10.15c0,0.659-0.354,1.273-0.924,1.604l-8.794,5.078C12.643,23.916,12.324,24,11.998,24z M19.099,13.993 c0-1.9-1.284-2.406-3.987-2.763c-2.731-0.361-3.009-0.548-3.009-1.187c0-0.528,0.235-1.233,2.258-1.233 c1.807,0,2.473,0.389,2.747,1.607c0.024,0.115,0.129,0.199,0.247,0.199h1.141c0.071,0,0.138-0.031,0.186-0.081 c0.048-0.054,0.074-0.123,0.067-0.196c-0.177-2.098-1.571-3.076-4.388-3.076c-2.508,0-4.004,1.058-4.004,2.833 c0,1.925,1.488,2.457,3.895,2.695c2.88,0.282,3.103,0.703,3.103,1.269c0,0.983-0.789,1.402-2.642,1.402 c-2.327,0-2.839-0.584-3.011-1.742c-0.02-0.124-0.126-0.215-0.253-0.215h-1.137c-0.141,0-0.254,0.112-0.254,0.253 c0,1.482,0.806,3.248,4.655,3.248C17.501,17.007,19.099,15.91,19.099,13.993z"/></svg>
    <text x="912" y="356" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">P2 · node API</text>
    <text x="912" y="375" font-size="11" fill="#64748B" text-anchor="middle">IDOR 차단 · 레이트리밋</text>
    <text x="912" y="391" font-size="11" fill="#64748B" text-anchor="middle">신고 임계 자동숨김 · 멱등</text>
  </g>

  <!-- ===== 데이터스토어: SQLite (open rectangle ▭) ===== -->
  <g filter="url(#cardSh)">
    <path d="M1116,308 H1316 M1116,438 H1316" stroke="#003B57" stroke-width="2.4"/>
    <rect x="1116" y="308" width="200" height="130" fill="#FFFFFF" stroke="none"/>
    <path d="M1116,308 H1316 M1116,438 H1316" stroke="#003B57" stroke-width="2.4"/>
    <svg x="1136" y="328" width="38" height="38" viewBox="0 0 24 24"><path fill="#003B57" d="M21.678.521c-1.032-.92-2.28-.55-3.513.544a8.71 8.71 0 0 0-.547.535c-2.109 2.237-4.066 6.38-4.674 9.544.237.48.422 1.093.544 1.561a13.044 13.044 0 0 1 .164.703s-.019-.071-.096-.296l-.05-.146a1.689 1.689 0 0 0-.033-.08c-.138-.32-.518-.995-.686-1.289-.143.423-.27.818-.376 1.176.484.884.778 2.4.778 2.4s-.025-.099-.147-.442c-.107-.303-.644-1.244-.772-1.464-.217.804-.304 1.346-.226 1.478.152.256.296.698.422 1.186.286 1.1.485 2.44.485 2.44l.017.224a22.41 22.41 0 0 0 .056 2.748c.095 1.146.273 2.13.5 2.657l.155-.084c-.334-1.038-.47-2.399-.41-3.967.09-2.398.642-5.29 1.661-8.304 1.723-4.55 4.113-8.201 6.3-9.945-1.993 1.8-4.692 7.63-5.5 9.788-.904 2.416-1.545 4.684-1.931 6.857.666-2.037 2.821-2.912 2.821-2.912s1.057-1.304 2.292-3.166c-.74.169-1.955.458-2.362.629-.6.251-.762.337-.762.337s1.945-1.184 3.613-1.72C21.695 7.9 24.195 2.767 21.678.521m-18.573.543A1.842 1.842 0 0 0 1.27 2.9v16.608a1.84 1.84 0 0 0 1.835 1.834h9.418a22.953 22.953 0 0 1-.052-2.707c-.006-.062-.011-.141-.016-.2a27.01 27.01 0 0 0-.473-2.378c-.121-.47-.275-.898-.369-1.057-.116-.197-.098-.31-.097-.432 0-.12.015-.245.037-.386a9.98 9.98 0 0 1 .234-1.045l.217-.028c-.017-.035-.014-.065-.031-.097l-.041-.381a32.8 32.8 0 0 1 .382-1.194l.2-.019c-.008-.016-.01-.038-.018-.053l-.043-.316c.63-3.28 2.587-7.443 4.8-9.791.066-.069.133-.128.198-.194Z"/></svg>
    <text x="1178" y="350" font-size="14" font-weight="700" fill="#0F172A">D1 · SQLite</text>
    <text x="1136" y="382" font-size="11" fill="#64748B">harmony.db (단일 파일)</text>
    <text x="1136" y="400" font-size="11" fill="#64748B">파일 IO · 외부 노출 없음</text>
    <text x="1136" y="418" font-size="11" fill="#64748B">데이터스토어 ▭</text>
  </g>

  <!-- ===== 메인 데이터 흐름 (직교) ===== -->
  <!-- 요청선은 원 변 중점 위쪽(cy-12, y=348), 응답선은 아래쪽(cy+12, y=372)에서 원 둘레에 정확히 부착 -->
  <!-- 기기 → nginx : HTTPS 443 (P1 좌측 둘레 y=348 → x=528-sqrt(78^2-12^2)=451) -->
  <polyline points="308,348 451,348" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g><rect x="332" y="320" width="116" height="22" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="390" y="335" font-size="11" fill="#334155" text-anchor="middle">HTTPS 443 · 익명요청</text></g>

  <!-- nginx → node : 127.0.0.1:8080 (P1 우측 둘레 605, P2 좌측 둘레 833 @y=348) -->
  <polyline points="605,348 833,348" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g><rect x="660" y="320" width="120" height="22" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="720" y="335" font-size="11" fill="#334155" text-anchor="middle">프록시 127.0.0.1:8080</text></g>

  <!-- node → SQLite : 파일 IO (P2 우측 둘레 991 @y=348) -->
  <polyline points="991,348 1116,348" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g><rect x="1000" y="320" width="112" height="22" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="1056" y="335" font-size="11" fill="#334155" text-anchor="middle">파일 IO (node:sqlite)</text></g>

  <!-- 응답 역방향 (점선 soft) — y=372 라인, 원 둘레 정확 부착 -->
  <!-- SQLite → node (P2 우측 둘레 991 @y=372) -->
  <polyline points="1116,372 991,372" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <!-- node → nginx (P2 좌측 둘레 833, P1 우측 둘레 605 @y=372) -->
  <polyline points="833,372 605,372" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <!-- nginx → 기기 (P1 좌측 둘레 451 @y=372, 기기 우변 308 @y=372) -->
  <polyline points="451,372 308,372" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <text x="720" y="466" font-size="11" fill="#64748B" text-anchor="middle">응답 (조회/상태)</text>

  <!-- ===== 솔로 연주: 경계 밖 완결 (서버 미도달) ===== -->
  <g>
    <rect x="96" y="500" width="212" height="92" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="116" y="528" font-size="13" font-weight="700" fill="#475569">솔로 연주 (로컬 완결)</text>
    <text x="116" y="550" font-size="11" fill="#64748B">기기 내 Tone.js · MediaPipe</text>
    <text x="116" y="568" font-size="11" fill="#64748B">신뢰경계 밖에서 완결</text>
    <text x="116" y="584" font-size="11" fill="#475569" font-weight="700">서버 미도달 (요청 0)</text>
  </g>
  <!-- 솔로 루프백 화살표 (기기 자체) — 솔로박스 상변 중점(202,500)에서 기기 하변 중점(202,420)으로 직교 부착 -->
  <polyline points="202,500 202,420" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>

  <!-- ===== Known Limitation (빨강 노트박스) ===== -->
  <g>
    <rect x="372" y="500" width="380" height="120" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4"/>
    <text x="392" y="528" font-size="13" font-weight="700" fill="#DC2626">Known Limitation (잔여 리스크)</text>
    <text x="392" y="552" font-size="11.5" fill="#334155">· code 열거(추측 가능한 공유 코드 무차별 시도)</text>
    <text x="392" y="573" font-size="11.5" fill="#334155">· 신고자 위조(익명키 기반 = reporter_key 약한 식별)</text>
    <text x="392" y="594" font-size="11.5" fill="#334155">· 인증 없음 = 의도된 데모 범위 (users/auth 테이블 없음)</text>
    <text x="392" y="613" font-size="11" fill="#64748B">완화: IDOR 차단 · 신고 임계 자동숨김 · 레이트리밋 · 멱등</text>
  </g>
  <!-- 리스크 지시선: code 열거는 nginx/API 진입을 노린다 — P2 좌변 중점(832,360)에 직교 부착 -->
  <polyline points="752,540 800,540 800,360 832,360" fill="none" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arwRisk)"/>

  <!-- ===== shield 하드닝 배지 (localhost 경계) ===== -->
  <g>
    <rect x="792" y="500" width="540" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <svg x="810" y="518" width="44" height="44" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 8.4-8 9-4.6-.6-8-4-8-9V5l8-3z" fill="#10B981"/><path d="M10.6 13.4l-2-2-1.4 1.4 3.4 3.4 5.2-5.2-1.4-1.4z" fill="#ffffff"/></svg>
    <text x="866" y="528" font-size="13" font-weight="700" fill="#0F172A">systemd 하드닝 — 프로세스 경계 보강</text>
    <text x="866" y="548" font-size="11" fill="#64748B">NoNewPrivileges · ProtectSystem=full · ProtectHome · ReadWritePaths=data</text>
    <text x="866" y="566" font-size="11" fill="#64748B">DB는 8080·127.0.0.1 바인드 뒤 — 인터넷 직접 도달 경로 없음</text>
  </g>

  <!-- ===== 범례 ===== -->
  <g>
    <rect x="48" y="708" width="1384" height="252" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="72" y="738" font-size="13" font-weight="700" fill="#334155">범례 · DFD 표기</text>

    <!-- 외부 엔티티 -->
    <rect x="72" y="756" width="40" height="26" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
    <text x="124" y="774" font-size="12" fill="#334155">외부 엔티티 □ (기기/사용자 · 신뢰 밖)</text>

    <!-- 프로세스 -->
    <circle cx="92" cy="813" r="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="124" y="818" font-size="12" fill="#334155">프로세스 ○ (nginx · node API)</text>

    <!-- 데이터스토어 -->
    <path d="M72,848 H112 M72,872 H112" stroke="#003B57" stroke-width="2.4"/>
    <text x="124" y="866" font-size="12" fill="#334155">데이터스토어 ▭ (SQLite harmony.db)</text>

    <!-- 흐름선들 -->
    <line x1="500" y1="769" x2="556" y2="769" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
    <text x="572" y="773" font-size="12" fill="#334155">주 데이터 흐름 (요청)</text>

    <line x1="500" y1="813" x2="556" y2="813" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
    <text x="572" y="817" font-size="12" fill="#334155">응답 흐름</text>

    <line x1="500" y1="857" x2="556" y2="857" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
    <text x="572" y="861" font-size="12" fill="#334155">로컬 완결 (서버 미도달)</text>

    <line x1="820" y1="769" x2="876" y2="769" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arwRisk)"/>
    <text x="892" y="773" font-size="12" fill="#334155">잔여 리스크 (공격 시도)</text>

    <!-- 신뢰경계 -->
    <rect x="820" y="800" width="40" height="26" rx="4" fill="none" stroke="#1A8754" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="892" y="818" font-size="12" fill="#334155">신뢰경계 (점선) — 식별·인가 수준이 바뀌는 면</text>

    <!-- 핵심 진술 -->
    <line x1="820" y1="844" x2="820" y2="936" stroke="#E2E8F0" stroke-width="1"/>
    <text x="844" y="862" font-size="12" font-weight="700" fill="#475569">경계별 식별 수준</text>
    <text x="844" y="884" font-size="11.5" fill="#334155">① 인터넷: 익명 · 식별 없음 (인증 부재)</text>
    <text x="844" y="903" font-size="11.5" fill="#334155">② EC2 443: TLS 종단 · code=capability(공유 코드 보유 = 접근권)</text>
    <text x="844" y="922" font-size="11.5" fill="#334155">③ localhost: node API + SQLite, 인터넷 직접 도달 불가</text>

    <text x="72" y="903" font-size="11.5" fill="#64748B">유일한 공개면 = nginx(443).</text>
    <text x="72" y="922" font-size="11.5" fill="#64748B">익명키 = 약한 식별(reactions.anon_key · comment_reports.reporter_key).</text>
    <text x="72" y="941" font-size="11.5" fill="#64748B">code = 세션 공유 코드 = capability(소유 = 접근).</text>
