<svg viewBox="0 0 1440 1040" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1E293B"/></marker>
    <marker id="arwSoft" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/></marker>
    <marker id="arwAuto" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#B45309"/></marker>
    <filter id="cardSh" x="-4%" y="-4%" width="108%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="0" y="0" width="1440" height="1040" fill="#FFFFFF"/>

  <!-- 타이틀 블록 -->
  <text x="48" y="56" font-size="26" font-weight="700" fill="#0F172A">하모니 라이프사이클 상태도</text>
  <text x="48" y="82" font-size="14" fill="#475569">UML 상태머신 2종 — 곡(세션) 생애주기 · 댓글 모더레이션. 초기(●)·종료(◉) 표기, 전이 라벨 명시.</text>

  <!-- ============================================================= -->
  <!-- (A) 곡(세션) 생애주기 -->
  <!-- ============================================================= -->
  <rect x="48" y="120" width="1344" height="392" rx="14" fill="none" stroke="#5A6B7B" stroke-width="1.6"/>
  <g>
    <rect x="48" y="120" width="252" height="30" rx="0" fill="#232F3E"/>
    <text x="64" y="140" font-size="13" font-weight="700" fill="#FFFFFF">(A) 곡(세션) 생애주기</text>
  </g>
  <text x="316" y="140" font-size="12" fill="#64748B">sessions: published · hidden · origin_code(파생) 상태 전이</text>

  <!-- 초기 상태 ● -->
  <circle cx="120" cy="300" r="9" fill="#1E293B"/>
  <text x="120" y="332" font-size="11" fill="#64748B" text-anchor="middle">초기</text>

  <!-- 로컬 초안 (published=0) -->
  <g>
    <rect x="208" y="262" width="208" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <rect x="208" y="262" width="208" height="26" rx="10" fill="#F1F5F9"/>
    <rect x="208" y="278" width="208" height="10" fill="#F1F5F9"/>
    <text x="312" y="280" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">로컬 초안</text>
    <text x="312" y="308" font-size="11" fill="#64748B" text-anchor="middle">기기 내 작성 · 서버 미도달</text>
    <text x="312" y="326" font-size="11" fill="#94A3B8" text-anchor="middle">published = 0</text>
  </g>

  <!-- 게시 (published=1) -->
  <g>
    <rect x="552" y="262" width="208" height="76" rx="10" fill="#FFFFFF" stroke="#1A8754" stroke-width="1.4" filter="url(#cardSh)"/>
    <rect x="552" y="262" width="208" height="26" rx="10" fill="#F1FBF5"/>
    <rect x="552" y="278" width="208" height="10" fill="#F1FBF5"/>
    <text x="656" y="280" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">게시</text>
    <text x="656" y="308" font-size="11" fill="#64748B" text-anchor="middle">community 노출 · 코드 공유</text>
    <text x="656" y="326" font-size="11" fill="#94A3B8" text-anchor="middle">published = 1 · hidden = 0</text>
  </g>

  <!-- 숨김 (hidden=1, 소유자 수동) -->
  <g>
    <rect x="896" y="262" width="208" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <rect x="896" y="262" width="208" height="26" rx="10" fill="#F8FAFC"/>
    <rect x="896" y="278" width="208" height="10" fill="#F8FAFC"/>
    <text x="1000" y="280" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">숨김</text>
    <text x="1000" y="308" font-size="11" fill="#64748B" text-anchor="middle">목록 비노출 · 소유자 수동(가역)</text>
    <text x="1000" y="326" font-size="11" fill="#94A3B8" text-anchor="middle">hidden = 1</text>
  </g>

  <!-- 종료 상태 ◉ -->
  <g>
    <circle cx="1248" cy="300" r="11" fill="none" stroke="#1E293B" stroke-width="1.6"/>
    <circle cx="1248" cy="300" r="6" fill="#1E293B"/>
    <text x="1248" y="332" font-size="11" fill="#64748B" text-anchor="middle">종료</text>
  </g>

  <!-- 전이: 초기 ● → 로컬 초안 -->
  <polyline points="129,300 208,300" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g>
    <rect x="138" y="276" width="62" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="169" y="290" font-size="11" fill="#334155" text-anchor="middle">작성 시작</text>
  </g>

  <!-- 전이: 로컬 초안 → 게시 (공유) -->
  <polyline points="416,300 552,300" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g>
    <rect x="436" y="276" width="96" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="484" y="290" font-size="11" fill="#334155" text-anchor="middle">공유 POST /sessions</text>
  </g>

  <!-- 전이: 게시 → 숨김 (소유자 수동) -->
  <polyline points="760,300 896,300" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g>
    <rect x="784" y="276" width="152" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="860" y="290" font-size="11" fill="#334155" text-anchor="middle">소유자 숨김 / 다시 게시(복원)</text>
  </g>

  <!-- 자기 전이: 게시 → 게시 (파생 fork = 원곡 유지, 별개의 새 게시 곡 생성) -->
  <polyline points="600,262 600,212 712,212 712,262" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <g>
    <rect x="540" y="178" width="232" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="656" y="194" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">파생(fork): 별개의 새 게시 곡 생성</text>
    <text x="656" y="208" font-size="11" fill="#64748B" text-anchor="middle">effect: origin_code→원곡.code · 원곡은 게시 유지</text>
  </g>

  <!-- 전이: 게시 → 종료 (공개 유지 종료) -->
  <polyline points="656,338 656,452 1248,452 1248,311" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g>
    <rect x="920" y="442" width="120" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="980" y="456" font-size="11" fill="#334155" text-anchor="middle">공개 유지(데모 종료)</text>
  </g>

  <!-- 전이: 숨김 → 종료 -->
  <polyline points="1104,300 1237,300" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- (A) 주석 -->
  <text x="208" y="488" font-size="11" fill="#475569">· 파생(fork)은 원곡을 그대로 둔 채 별개의 새 게시 곡(별도 상태머신 인스턴스)을 만든다 — 게시 상태의 자기 전이로 표기.</text>
  <text x="208" y="506" font-size="11" fill="#475569">· 숨김은 소유자가 되돌릴 수 있는 가역 상태이며, 종료는 숨김 전용 결말이 아니다(게시 상태도 직접 종료 가능).</text>

  <!-- ============================================================= -->
  <!-- (B) 댓글 모더레이션 -->
  <!-- ============================================================= -->
  <rect x="48" y="556" width="1344" height="396" rx="14" fill="none" stroke="#5A6B7B" stroke-width="1.6"/>
  <g>
    <rect x="48" y="556" width="252" height="30" rx="0" fill="#232F3E"/>
    <text x="64" y="576" font-size="13" font-weight="700" fill="#FFFFFF">(B) 댓글 모더레이션</text>
  </g>
  <text x="316" y="576" font-size="12" fill="#64748B">comments + comment_reports: 신고 누적이 임계에 닿으면 자동 숨김</text>

  <!-- 초기 상태 ● -->
  <circle cx="120" cy="720" r="9" fill="#1E293B"/>
  <text x="120" y="752" font-size="11" fill="#64748B" text-anchor="middle">초기</text>

  <!-- 표시 -->
  <g>
    <rect x="208" y="682" width="208" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <rect x="208" y="682" width="208" height="26" rx="10" fill="#F1F5F9"/>
    <rect x="208" y="698" width="208" height="10" fill="#F1F5F9"/>
    <text x="312" y="700" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">표시</text>
    <text x="312" y="728" font-size="11" fill="#64748B" text-anchor="middle">댓글 작성 · 공개 노출</text>
    <text x="312" y="746" font-size="11" fill="#94A3B8" text-anchor="middle">hidden = 0 · reports = 0</text>
  </g>

  <!-- 신고 누적 (집계 상태) -->
  <g>
    <rect x="552" y="682" width="240" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <rect x="552" y="682" width="240" height="26" rx="10" fill="#F1F5F9"/>
    <rect x="552" y="698" width="240" height="10" fill="#F1F5F9"/>
    <text x="672" y="700" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">신고 누적</text>
    <text x="672" y="728" font-size="11" fill="#64748B" text-anchor="middle">고유 신고자별 1건(중복 차단)</text>
    <text x="672" y="746" font-size="11" fill="#94A3B8" text-anchor="middle">reports = 1 … 2 (임계 미만)</text>
  </g>

  <!-- 자동 숨김 -->
  <g>
    <rect x="928" y="682" width="240" height="76" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.4" filter="url(#cardSh)"/>
    <rect x="928" y="682" width="240" height="26" rx="10" fill="#FEF3C7"/>
    <rect x="928" y="698" width="240" height="10" fill="#FEF3C7"/>
    <svg x="940" y="686" width="18" height="18" viewBox="0 0 24 24">
      <path d="M12 2.5L22.8 21.2H1.2z" fill="#B45309"/><rect x="11" y="8.5" width="2" height="6.2" rx="1" fill="#ffffff"/><circle cx="12" cy="18" r="1.35" fill="#ffffff"/></svg>
    <text x="1056" y="700" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">자동 숨김</text>
    <text x="1056" y="728" font-size="11" fill="#92400E" text-anchor="middle">★ 유일한 자동 전이</text>
    <text x="1056" y="746" font-size="11" fill="#B45309" text-anchor="middle">hidden = 1 (시스템)</text>
  </g>

  <!-- 종료 상태 ◉ -->
  <g>
    <circle cx="1300" cy="720" r="11" fill="none" stroke="#1E293B" stroke-width="1.6"/>
    <circle cx="1300" cy="720" r="6" fill="#1E293B"/>
    <text x="1300" y="752" font-size="11" fill="#64748B" text-anchor="middle">종료</text>
  </g>

  <!-- 전이: 초기 ● → 표시 -->
  <polyline points="129,720 208,720" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g>
    <rect x="138" y="696" width="62" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="169" y="710" font-size="11" fill="#334155" text-anchor="middle">댓글 작성</text>
  </g>

  <!-- 전이: 표시 → 신고 누적 -->
  <polyline points="416,720 552,720" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g>
    <rect x="438" y="696" width="92" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="484" y="710" font-size="11" fill="#334155" text-anchor="middle">신고 접수(report)</text>
  </g>

  <!-- 자기 루프: 신고 누적 (추가 신고, 임계 미만) -->
  <polyline points="612,682 612,650 732,650 732,682" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <g>
    <rect x="614" y="640" width="116" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="672" y="654" font-size="11" fill="#475569" text-anchor="middle">추가 신고 (reports&lt;3)</text>
  </g>

  <!-- 전이: 신고 누적 → 자동 숨김 (임계 도달, 자동) -->
  <polyline points="792,720 928,720" fill="none" stroke="#B45309" stroke-width="1.8" marker-end="url(#arwAuto)"/>
  <g>
    <rect x="772" y="744" width="176" height="22" rx="6" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="860" y="759" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">[reports = 3] 임계 도달 → 자동</text>
  </g>

  <!-- 전이: 자동 숨김 → 종료 -->
  <polyline points="1168,720 1289,720" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- (B) 주석 -->
  <text x="208" y="800" font-size="11" fill="#475569">· 임계값은 REPORT_HIDE_THRESHOLD = 3. 동일 신고자 중복 신고는 집계되지 않는다(comment_reports 복합 PK).</text>
  <text x="208" y="820" font-size="11" fill="#475569">· 이 시스템에서 사람 개입 없이 일어나는 전이는 "신고 누적 → 자동 숨김" 하나뿐이다.</text>

  <!-- 범례 박스 -->
  <rect x="48" y="850" width="1344" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="68" y="878" font-size="12" font-weight="700" fill="#334155">범례</text>

  <circle cx="80" cy="902" r="7" fill="#1E293B"/>
  <text x="96" y="906" font-size="12" fill="#475569">초기 의사상태</text>

  <circle cx="232" cy="902" r="8" fill="none" stroke="#1E293B" stroke-width="1.6"/>
  <circle cx="232" cy="902" r="4.5" fill="#1E293B"/>
  <text x="248" y="906" font-size="12" fill="#475569">종료 상태</text>

  <line x1="372" y1="902" x2="424" y2="902" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="436" y="906" font-size="12" fill="#475569">사용자 행동 전이</text>

  <line x1="592" y1="902" x2="644" y2="902" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <text x="656" y="906" font-size="12" fill="#475569">보조·자기 루프 전이</text>

  <line x1="836" y1="902" x2="888" y2="902" stroke="#B45309" stroke-width="1.8" marker-end="url(#arwAuto)"/>
  <text x="900" y="906" font-size="12" fill="#475569">★ 자동 전이(시스템) — 임계 기반 숨김</text>

  <text x="1180" y="906" font-size="12" fill="#475569">[ ] = 가드 조건</text>
</svg>
