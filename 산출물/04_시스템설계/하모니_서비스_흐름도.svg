<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1E293B"/></marker>
    <marker id="arwSoft" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/></marker>
    <filter id="cardSh" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

  <!-- 타이틀 블록 -->
  <text x="56" y="58" font-size="26" font-weight="700" fill="#0F172A">합주 공유 서비스 흐름</text>
  <text x="56" y="84" font-size="14" fill="#475569">사용자 A가 만든 곡을 서버(API·SQLite)에 공유하고, 사용자 B가 받아 레이어를 얹어 함께 듣는 비동기 합주 흐름</text>

  <!-- ===== 스윔레인 3레인 ===== -->
  <!-- 레인 본문 영역 y: 168~900 -->
  <!-- 레인 A: x 88~536 / 서버: x 576~1024 / 레인 B: x 1064~1512 -->

  <!-- 레인 배경 -->
  <rect x="88" y="168" width="448" height="744" rx="14" fill="#FCFCFD" stroke="#E2E8F0" stroke-width="1.6"/>
  <rect x="576" y="168" width="448" height="744" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <rect x="1064" y="168" width="448" height="744" rx="14" fill="#FCFCFD" stroke="#E2E8F0" stroke-width="1.6"/>

  <!-- 레인 헤더 (연회색) -->
  <rect x="88" y="168" width="448" height="48" rx="14" fill="#EEF2F6"/>
  <rect x="88" y="200" width="448" height="16" fill="#EEF2F6"/>
  <rect x="576" y="168" width="448" height="48" rx="14" fill="#E5EAF0"/>
  <rect x="576" y="200" width="448" height="16" fill="#E5EAF0"/>
  <rect x="1064" y="168" width="448" height="48" rx="14" fill="#EEF2F6"/>
  <rect x="1064" y="200" width="448" height="16" fill="#EEF2F6"/>

  <!-- 레인 헤더 라벨 + 아이콘 -->
  <svg x="120" y="180" width="24" height="24" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" fill="#475569"/>
    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="#475569"/></svg>
  <text x="156" y="198" font-size="15" font-weight="700" fill="#334155">사용자 A (작곡·공유)</text>

  <svg x="608" y="180" width="24" height="24" viewBox="0 0 24 24">
    <path fill="#5FA04E" d="M11.998,24c-0.321,0-0.641-0.084-0.922-0.247l-2.936-1.737c-0.438-0.245-0.224-0.332-0.08-0.383 c0.585-0.203,0.703-0.25,1.328-0.604c0.065-0.037,0.151-0.023,0.218,0.017l2.256,1.339c0.082,0.045,0.197,0.045,0.272,0l8.795-5.076 c0.082-0.047,0.134-0.141,0.134-0.238V6.921c0-0.099-0.053-0.192-0.137-0.242l-8.791-5.072c-0.081-0.047-0.189-0.047-0.271,0 L3.075,6.68C2.99,6.729,2.936,6.825,2.936,6.921v10.15c0,0.097,0.054,0.189,0.139,0.235l2.409,1.392 c1.307,0.654,2.108-0.116,2.108-0.89V7.787c0-0.142,0.114-0.253,0.256-0.253h1.115c0.139,0,0.255,0.112,0.255,0.253v10.021 c0,1.745-0.95,2.745-2.604,2.745c-0.508,0-0.909,0-2.026-0.551L2.28,18.675c-0.57-0.329-0.922-0.945-0.922-1.604V6.921 c0-0.659,0.353-1.275,0.922-1.603l8.795-5.082c0.557-0.315,1.296-0.315,1.848,0l8.794,5.082c0.57,0.329,0.924,0.944,0.924,1.603 v10.15c0,0.659-0.354,1.273-0.924,1.604l-8.794,5.078C12.643,23.916,12.324,24,11.998,24z M19.099,13.993 c0-1.9-1.284-2.406-3.987-2.763c-2.731-0.361-3.009-0.548-3.009-1.187c0-0.528,0.235-1.233,2.258-1.233 c1.807,0,2.473,0.389,2.747,1.607c0.024,0.115,0.129,0.199,0.247,0.199h1.141c0.071,0,0.138-0.031,0.186-0.081 c0.048-0.054,0.074-0.123,0.067-0.196c-0.177-2.098-1.571-3.076-4.388-3.076c-2.508,0-4.004,1.058-4.004,2.833 c0,1.925,1.488,2.457,3.895,2.695c2.88,0.282,3.103,0.703,3.103,1.269c0,0.983-0.789,1.402-2.642,1.402 c-2.327,0-2.839-0.584-3.011-1.742c-0.02-0.124-0.126-0.215-0.253-0.215h-1.137c-0.141,0-0.254,0.112-0.254,0.253 c0,1.482,0.806,3.248,4.655,3.248C17.501,17.007,19.099,15.91,19.099,13.993z"/></svg>
  <text x="644" y="198" font-size="15" font-weight="700" fill="#334155">서버 (Node API · SQLite)</text>

  <svg x="1096" y="180" width="24" height="24" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" fill="#475569"/>
    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="#475569"/></svg>
  <text x="1132" y="198" font-size="15" font-weight="700" fill="#334155">사용자 B (받기·합주)</text>

  <!-- ===== 노드 카드들 ===== -->
  <!-- 카드 폭 320, 레인 중앙 정렬. A중앙 x=312-160=152 ; 서버중앙 x=640 ; B중앙 x=1128 -->

  <!-- A-① 연주 기록 (로컬) -->
  <g>
    <rect x="152" y="256" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <circle cx="188" cy="288" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="188" y="293" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="middle">①</text>
    <text x="220" y="285" font-size="14" font-weight="700" fill="#0F172A">연주 기록 (로컬)</text>
    <text x="220" y="306" font-size="11" fill="#64748B">미니앱에서 트랙 녹음 · 솔로는 서버 미도달</text>
    <text x="220" y="323" font-size="11" fill="#64748B">클라이언트에서 곡 데이터 구성</text>
  </g>

  <!-- 서버 카드들 -->
  <!-- S-② POST /sessions -->
  <g>
    <rect x="640" y="256" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <circle cx="676" cy="288" r="15" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
    <text x="676" y="293" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">②</text>
    <text x="708" y="285" font-size="14" font-weight="700" fill="#0F172A">POST /sessions</text>
    <text x="708" y="306" font-size="11" fill="#64748B">곡 공유 · sessions 행 생성 · code 발급</text>
    <text x="708" y="323" font-size="11" fill="#64748B">A에게 공유 code 반환</text>
  </g>

  <!-- S-④ POST /sessions/:code/tracks -->
  <g>
    <rect x="640" y="480" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <circle cx="676" cy="512" r="15" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
    <text x="676" y="517" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">④</text>
    <text x="708" y="509" font-size="14" font-weight="700" fill="#0F172A">POST …/tracks</text>
    <text x="708" y="530" font-size="11" fill="#64748B">B의 레이어 추가 · tracks 행 append</text>
    <text x="708" y="547" font-size="11" fill="#64748B">track_count 갱신</text>
  </g>

  <!-- S-⑦ origin_code 파생 -->
  <g>
    <rect x="640" y="700" width="320" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <circle cx="676" cy="736" r="15" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
    <text x="676" y="741" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">⑦</text>
    <text x="708" y="730" font-size="14" font-weight="700" fill="#0F172A">출처 루프 (origin_code)</text>
    <text x="708" y="751" font-size="11" fill="#64748B">파생곡이면 origin_code → 원곡 code</text>
    <text x="708" y="768" font-size="11" fill="#64748B">sessions 자기참조 = 리믹스 트리</text>
    <text x="708" y="785" font-size="11" fill="#64748B">출처 표기로 원작자 연결 유지</text>
  </g>

  <!-- 서버 데이터스토어 칩 (SQLite) -->
  <g>
    <rect x="640" y="372" width="320" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
    <svg x="660" y="384" width="32" height="32" viewBox="0 0 24 24">
      <path fill="#003B57" d="M21.678.521c-1.032-.92-2.28-.55-3.513.544a8.71 8.71 0 0 0-.547.535c-2.109 2.237-4.066 6.38-4.674 9.544.237.48.422 1.093.544 1.561a13.044 13.044 0 0 1 .164.703s-.019-.071-.096-.296l-.05-.146a1.689 1.689 0 0 0-.033-.08c-.138-.32-.518-.995-.686-1.289-.143.423-.27.818-.376 1.176.484.884.778 2.4.778 2.4s-.025-.099-.147-.442c-.107-.303-.644-1.244-.772-1.464-.217.804-.304 1.346-.226 1.478.152.256.296.698.422 1.186.286 1.1.485 2.44.485 2.44l.017.224a22.41 22.41 0 0 0 .056 2.748c.095 1.146.273 2.13.5 2.657l.155-.084c-.334-1.038-.47-2.399-.41-3.967.09-2.398.642-5.29 1.661-8.304 1.723-4.55 4.113-8.201 6.3-9.945-1.993 1.8-4.692 7.63-5.5 9.788-.904 2.416-1.545 4.684-1.931 6.857.666-2.037 2.821-2.912 2.821-2.912s1.057-1.304 2.292-3.166c-.74.169-1.955.458-2.362.629-.6.251-.762.337-.762.337s1.945-1.184 3.613-1.72C21.695 7.9 24.195 2.767 21.678.521m-18.573.543A1.842 1.842 0 0 0 1.27 2.9v16.608a1.84 1.84 0 0 0 1.835 1.834h9.418a22.953 22.953 0 0 1-.052-2.707c-.006-.062-.011-.141-.016-.2a27.01 27.01 0 0 0-.473-2.378c-.121-.47-.275-.898-.369-1.057-.116-.197-.098-.31-.097-.432 0-.12.015-.245.037-.386a9.98 9.98 0 0 1 .234-1.045l.217-.028c-.017-.035-.014-.065-.031-.097l-.041-.381a32.8 32.8 0 0 1 .382-1.194l.2-.019c-.008-.016-.01-.038-.018-.053l-.043-.316c.63-3.28 2.587-7.443 4.8-9.791.066-.069.133-.128.198-.194Z"/></svg>
    <text x="704" y="396" font-size="13" font-weight="700" fill="#0F172A">SQLite harmony.db</text>
    <text x="704" y="414" font-size="11" fill="#64748B">sessions · tracks 영속 저장 (단일 파일)</text>
  </g>

  <!-- B-③ GET /sessions/:code -->
  <g>
    <rect x="1128" y="256" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <circle cx="1164" cy="288" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="1164" y="293" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="middle">③</text>
    <text x="1196" y="285" font-size="14" font-weight="700" fill="#0F172A">GET /sessions/:code</text>
    <text x="1196" y="306" font-size="11" fill="#64748B">code로 곡·트랙 받기 · 재생 준비</text>
    <text x="1196" y="323" font-size="11" fill="#64748B">B 미니앱에 로드</text>
  </g>

  <!-- B-⑤ 폴링 1.5s -->
  <g>
    <rect x="1128" y="480" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <circle cx="1164" cy="512" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="1164" y="517" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="middle">⑤</text>
    <text x="1196" y="509" font-size="14" font-weight="700" fill="#0F172A">폴링 1.5초 자동 반영</text>
    <text x="1196" y="530" font-size="11" fill="#64748B">주기적 GET 재조회 (WebSocket 아님)</text>
    <text x="1196" y="547" font-size="11" fill="#64748B">새 트랙 자동 갱신</text>
  </g>

  <!-- B-⑥ 합주 합쳐듣기 -->
  <g>
    <rect x="1128" y="700" width="320" height="84" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#cardSh)"/>
    <circle cx="1164" cy="732" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="1164" y="737" font-size="15" font-weight="700" fill="#1E40AF" text-anchor="middle">⑥</text>
    <text x="1196" y="729" font-size="14" font-weight="700" fill="#0F172A">합주 합쳐듣기</text>
    <text x="1196" y="750" font-size="11" fill="#64748B">A·B 레이어를 클라에서 합성 재생</text>
    <text x="1196" y="767" font-size="11" fill="#64748B">비동기 합주 완성</text>
  </g>

  <!-- ===== 직교 커넥터 (메인 흐름) ===== -->
  <!-- ① A하단(312,340) → 아래로 → 서버② 좌변(640,298): A하단 → y=298 수평 → ②좌변 -->
  <!-- ① → ② : A카드 우변(472,298) → 서버②좌변(640,298) -->
  <polyline points="472,298 640,298" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g><rect x="500" y="270" width="112" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="556" y="284" font-size="11" fill="#334155" text-anchor="middle">곡 공유 요청</text></g>

  <!-- ② 서버 → SQLite 저장 (내부, 점선) ②하단(800,340) → ▭상단(800,372) -->
  <polyline points="800,340 800,372" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>

  <!-- ② → ③ : 서버②우변(960,298) → B③좌변(1128,298) -->
  <polyline points="960,298 1128,298" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g><rect x="980" y="270" width="128" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="1044" y="284" font-size="11" fill="#334155" text-anchor="middle">code 공유 · B 받기</text></g>

  <!-- ③ → ④ : B③하단(1288,340) → 아래 → ④로. B③하단 → y=522 → 서버④우변(960,522) -->
  <polyline points="1288,340 1288,522 960,522" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g><rect x="1224" y="430" width="128" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="1288" y="444" font-size="11" fill="#334155" text-anchor="middle">레이어 얹기 POST</text></g>

  <!-- ④ 서버 → SQLite append (내부 점선) ④상단(800,480) → ▭하단(800,428) -->
  <polyline points="800,480 800,428" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>

  <!-- ④ → ⑤ : 서버④우변(960,522) ... 이미 ③→④에서 사용. ⑤는 폴링이 서버로 가는 흐름 -->
  <!-- ⑤ 폴링 : B⑤좌변(1128,540) → 서버④우변(960,540) 주기적 재조회 요청(B→서버) -->
  <polyline points="1128,540 960,540" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <g><rect x="980" y="548" width="128" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="1044" y="562" font-size="11" fill="#334155" text-anchor="middle">폴링 GET 1.5s</text></g>

  <!-- ⑤ → ⑥ : B⑤하단(1288,564) → B⑥상단(1288,700) -->
  <polyline points="1288,564 1288,700" fill="none" stroke="#1E293B" stroke-width="1.8" marker-end="url(#arw)"/>
  <g><rect x="1232" y="622" width="112" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="1288" y="636" font-size="11" fill="#334155" text-anchor="middle">자동 반영 후</text></g>

  <!-- ⑦ 출처 보존: ②(공유 시점)의 파생 속성 = sessions 자기참조 점선 루프 (origin_code → 원곡 code) -->
  <!-- ⑦좌변(640,746) → 좌로 x=604 → 위로 y=314 → ②좌변(640,314) : 비식별 점선 -->
  <polyline points="640,746 604,746 604,314 640,314" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwSoft)"/>
  <g><rect x="540" y="520" width="128" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
     <text x="604" y="534" font-size="11" fill="#334155" text-anchor="middle">파생 공유 시 origin_code</text></g>

  <!-- ===== 범례 박스 ===== -->
  <rect x="88" y="936" width="900" height="48" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="108" y="956" font-size="12" font-weight="700" fill="#334155">범례</text>
  <line x1="160" y1="952" x2="200" y2="952" stroke="#1E293B" stroke-width="1.8"/>
  <text x="208" y="956" font-size="12" fill="#475569">메인 흐름 (HTTP 요청·응답)</text>
  <line x1="420" y1="952" x2="460" y2="952" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="468" y="956" font-size="12" fill="#475569">내부·폴링·자기참조 (보조)</text>
  <circle cx="700" cy="952" r="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="694" y="956" font-size="11" font-weight="700" fill="#1E40AF">①</text>
  <text x="716" y="956" font-size="12" fill="#475569">순서 단계 칩 (①~⑦)</text>

  <!-- 한계 노트 (인증 없음) -->
  <rect x="1008" y="936" width="504" height="48" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="1028" y="956" font-size="12" font-weight="700" fill="#DC2626">없음</text>
  <text x="1076" y="956" font-size="12" fill="#475569">실시간 스트리밍·WebSocket 없음(1.5s 폴링) · 인증 없음(code = 접근 권한)</text>

</svg>
