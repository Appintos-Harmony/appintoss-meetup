    <text x="140" y="934" font-size="11" fill="#64748B">PK = 기본키(밑줄) · FK = 외래키 · 모든 시각 UTC 저장 · 익명키 = 약한 식별(디바이스 기반)</text>
  </g>

  <!-- ============================================================ -->
  <!-- "없음" 노트 박스 (빨강)                                        -->
  <!-- ============================================================ -->
  <g>
    <rect x="880" y="776" width="600" height="184" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="900" y="804" font-size="13" font-weight="700" fill="#DC2626">없음 — users / auth 개체 없음 (의도된 데모 범위)</text>
    <text x="900" y="832" font-size="12" fill="#334155">· 사용자·계정·세션·역할 테이블이 존재하지 않는다 (로그인 없음).</text>
    <text x="900" y="854" font-size="12" fill="#334155">· 신원은 author_key / anon_key / reporter_key 익명키로만 표현.</text>
    <text x="900" y="876" font-size="12" fill="#334155">· code 는 공유 capability — 알면 접근(열거 가능성은 의도된 트레이드오프).</text>
    <text x="900" y="898" font-size="12" fill="#334155">· FK는 애플리케이션 레벨에서 보증(파일 DB 단순 스키마).</text>
    <text x="900" y="928" font-size="11" fill="#DC2626">한계: 강한 사용자 식별·권한 분리 없음 → 인증 도입 시 별도 개체 추가 필요.</text>
