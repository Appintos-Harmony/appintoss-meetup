  <g>
    <rect x="496" y="590" width="88" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="540" y="604" font-size="11" fill="#334155" text-anchor="middle">받는다 · 식별</text>
  </g>

  <!-- (3) 곡 1—N 댓글 (비식별·점선) : 곡 우변(440,360) → 댓글 좌변(1120,300) -->
