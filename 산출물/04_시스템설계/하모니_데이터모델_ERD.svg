  <!-- ============================================================ -->
  <!-- 범례 박스                                                     -->
  <!-- ============================================================ -->
  <g>
    <rect x="120" y="776" width="720" height="184" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="140" y="804" font-size="13" font-weight="700" fill="#334155">범례 — 표기 규약</text>

    <line x1="144" y1="830" x2="200" y2="830" stroke="#1A8754" stroke-width="1.6"/>
    <text x="212" y="834" font-size="12" fill="#334155">식별 관계 (실선) · 자식 PK에 부모 키 포함 — 좋아요·신고</text>

