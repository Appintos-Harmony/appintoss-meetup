    <text x="1340" y="484" font-size="11" fill="#334155" text-anchor="middle">신고된다 · 식별</text>
  </g>

  <!-- (5) 곡.origin_code → 곡.code 자기참조 (직교 루프백) -->
  <!-- origin_code 행(120,398) → 왼쪽 72 → 위로 → code 행(120,259) -->
  <polyline points="120,398 72,398 72,259 120,259" fill="none" stroke="#B45309" stroke-width="1.4"/>
  <line x1="92" y1="249" x2="92" y2="269" stroke="#B45309" stroke-width="1.4"/>
