  <!-- ============================================================ -->

  <!-- (1) 곡 1—N 트랙 (비식별·점선) : 곡 우변(440,264) → 트랙 좌변(640,264) -->
  <polyline points="440,264 640,264" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="468" y1="254" x2="468" y2="274" stroke="#64748B" stroke-width="1.4"/>
  <polyline points="612,254 640,264 612,274" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <line x1="612" y1="264" x2="640" y2="264" stroke="#64748B" stroke-width="1.4"/>
  <g>
    <rect x="496" y="242" width="88" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="540" y="256" font-size="11" fill="#334155" text-anchor="middle">갖는다 · 비식별</text>
  </g>

  <!-- (2) 곡 1—N 좋아요 (식별·실선) : 곡 우변(440,440) → 좋아요 좌변(640,600) -->
  <polyline points="440,440 540,440 540,600 640,600" fill="none" stroke="#1A8754" stroke-width="1.6"/>
  <line x1="468" y1="430" x2="468" y2="450" stroke="#1A8754" stroke-width="1.6"/>
  <polyline points="612,590 640,600 612,610" fill="none" stroke="#1A8754" stroke-width="1.6"/>
