    <text x="212" y="862" font-size="12" fill="#334155">비식별 관계 (점선) · 자식이 별도 PK 보유 — 트랙·댓글</text>

    <line x1="144" y1="886" x2="200" y2="886" stroke="#B45309" stroke-width="1.4"/>
    <text x="212" y="890" font-size="12" fill="#334155">자기참조 (origin_code → code) · 곡 파생/리믹스 트리</text>

