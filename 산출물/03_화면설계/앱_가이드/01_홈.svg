<svg width="100%" viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img"><title>하모니 홈: 시작 화면 가이드</title><desc>홈 화면(좌)에 번호 콜아웃을 달고, 우측에 4단계 사용법(스튜디오로 새 곡 녹음·커뮤니티에서 남의 음원에 얹기·이어하기로 만들던 곡 이어서·설정에서 프로필 닉네임)을 설명하는 발표/도움말용 한 장.</desc>

  <!-- 배경 -->
  <rect x="0" y="0" width="760" height="560" rx="18" fill="#f7f9fb"/>

  <!-- 제목 -->
  <text x="34" y="40" font-size="20" font-weight="800" fill="#191f28">하모니 홈: 시작 화면</text>
  <text x="34" y="61" font-size="12.5" fill="#6b7684">새 곡은 스튜디오에서 · 둘러보고 얹기는 커뮤니티에서 · 만들던 곡은 이어하기로</text>

  <!-- ===================== 좌: 폰 목업(콜아웃) ===================== -->
  <g transform="translate(28,82)">
    <rect x="0" y="0" width="300" height="452" rx="22" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
    <rect x="114" y="13" width="72" height="7" rx="3.5" fill="#e6e9ed"/>

    <!-- 앱바 -->
    <text x="18" y="49" font-size="15" font-weight="800" fill="#191f28">하모니</text>
    <text x="270" y="49" font-size="15" fill="#8b95a1">⚙️</text>
    <line x1="0" y1="64" x2="300" y2="64" stroke="#eef1f4" stroke-width="1"/>

    <!-- 인사 -->
    <text x="18" y="90" font-size="13" font-weight="700" fill="#191f28">안녕하세요, OO님 👋</text>

    <!-- 진입 카드 1: 스튜디오 -->
    <rect x="14" y="104" width="272" height="76" rx="13" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="44" cy="142" r="19" fill="#3182f622"/>
    <text x="44" y="149" text-anchor="middle" font-size="20">🎹</text>
    <text x="74" y="136" font-size="13" font-weight="800" fill="#191f28">스튜디오</text>
    <text x="74" y="154" font-size="10.5" fill="#8b95a1">새 곡 만들기 · 트랙 녹음</text>
    <text x="270" y="148" text-anchor="end" font-size="16" fill="#c9ced5">›</text>

    <!-- 진입 카드 2: 커뮤니티 -->
    <rect x="14" y="190" width="272" height="76" rx="13" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="44" cy="228" r="19" fill="#8b5cf622"/>
    <text x="44" y="235" text-anchor="middle" font-size="20">🎧</text>
    <text x="74" y="222" font-size="13" font-weight="800" fill="#191f28">커뮤니티</text>
    <text x="74" y="240" font-size="10.5" fill="#8b95a1">다른 사람 곡에 얹기 · 둘러보기</text>
    <text x="270" y="234" text-anchor="end" font-size="16" fill="#c9ced5">›</text>

    <!-- 이어하기 섹션 -->
    <text x="18" y="296" font-size="12" font-weight="800" fill="#191f28">이어하기</text>
    <rect x="14" y="306" width="272" height="92" rx="13" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="42" cy="338" r="16" fill="#15c47e22"/>
    <text x="42" y="344" text-anchor="middle" font-size="16">🎵</text>
    <text x="66" y="334" font-size="12" font-weight="700" fill="#191f28">봄날의 멜로디 <tspan font-weight="500" fill="#8b95a1">· 작업 중</tspan></text>
    <text x="66" y="350" font-size="10" fill="#8b95a1">트랙 2개 · 마지막 저장 2시간 전</text>
    <!-- 코드 칩 C / Am / F / G -->
    <rect x="66" y="364" width="34" height="22" rx="7" fill="#eef5ff"/>
    <text x="83" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3182f6">C</text>
    <rect x="105" y="364" width="40" height="22" rx="7" fill="#eef5ff"/>
    <text x="125" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3182f6">Am</text>
    <rect x="150" y="364" width="34" height="22" rx="7" fill="#eef5ff"/>
    <text x="167" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3182f6">F</text>
    <rect x="189" y="364" width="34" height="22" rx="7" fill="#eef5ff"/>
    <text x="206" y="379" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3182f6">G</text>
    <text x="270" y="378" text-anchor="end" font-size="16" fill="#c9ced5">›</text>

    <!-- 콜아웃 배지 -->
    <g font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
      <circle cx="150" cy="142" r="11" fill="#ff6b6b"/><text x="150" y="146">1</text>
      <circle cx="150" cy="228" r="11" fill="#3182f6"/><text x="150" y="232">2</text>
      <circle cx="40" cy="316" r="11" fill="#ff6b6b"/><text x="40" y="320">3</text>
      <circle cx="270" cy="44" r="11" fill="#3182f6"/><text x="270" y="48">4</text>
    </g>
  </g>

  <!-- ===================== 우: 4단계 설명 ===================== -->
  <g transform="translate(360,86)">
    <!-- step 1 -->
    <g transform="translate(0,0)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">스튜디오: 새 곡 만들기</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">처음부터 트랙을 녹음해 새 곡을 만들어요. 빈 곡으로</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">시작해 한 겹씩 쌓는 게 기본 작업 공간이에요.</text>
    </g>
    <!-- step 2 -->
    <g transform="translate(0,72)">
      <circle cx="14" cy="14" r="13" fill="#3182f6"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">커뮤니티: 둘러보고 얹기</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">다른 사람의 음원을 둘러보고, 마음에 들면 담아서</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">내 스튜디오에 얹어요. 함께 만드는 합주의 시작.</text>
    </g>
    <!-- step 3 -->
    <g transform="translate(0,144)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">이어하기: 만들던 곡 이어서</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">최근 곡 카드를 탭하면 그 곡이 스튜디오에 로드돼요.</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">코드 칩(C·Am·F·G)으로 어떤 곡인지 한눈에 확인.</text>
    </g>
    <!-- step 4 -->
    <g transform="translate(0,216)">
      <circle cx="14" cy="14" r="13" fill="#3182f6"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">⚙️ 설정: 프로필</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">우측 상단 설정에서 이모지 프로필과 닉네임을</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">정해요. 커뮤니티에서 나를 보여 줄 얼굴이에요.</text>
    </g>

    <!-- 핵심 요약 띠 -->
    <g transform="translate(0,288)">
      <rect x="0" y="0" width="372" height="56" rx="12" fill="#eef5ff" stroke="#cfe0ff" stroke-width="1"/>
      <text x="16" y="22" font-size="11" font-weight="800" fill="#3182f6">핵심</text>
      <text x="16" y="42" font-size="11.5" fill="#3457d5">새 곡은 스튜디오, 만들던 곡은 이어하기.</text>
    </g>

    <!-- 진입 경로 보조 안내 -->
    <g transform="translate(0,360)">
      <text x="0" y="14" font-size="10.5" fill="#8b95a1">홈 두 카드(🎹 스튜디오 · 🎧 커뮤니티)가 모든 작업의 출발점.</text>
      <text x="0" y="32" font-size="10.5" fill="#8b95a1">이어하기 섹션은 진행 중인 내 곡만 모아 빠르게 다시 열어요.</text>
    </g>
  </g>
</svg>
