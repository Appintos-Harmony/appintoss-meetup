<svg width="100%" viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img"><title>설정: 프로필과 환경</title><desc>설정 화면(좌)에 번호 콜아웃을 달고, 우측에 4단계 설명(이모지 프로필·닉네임과 버전·개발자 모드 디버그·법적 고지 준비 중)을 설명하는 발표/도움말용 한 장. 이모지·닉네임으로 내 프로필, 개발자 모드는 디버그용.</desc>

  <!-- 배경 -->
  <rect x="0" y="0" width="760" height="560" rx="18" fill="#f7f9fb"/>

  <!-- 제목 -->
  <text x="34" y="40" font-size="20" font-weight="800" fill="#191f28">설정: 프로필과 환경</text>
  <text x="34" y="61" font-size="12.5" fill="#6b7684">이모지 프로필 · 닉네임과 버전 · 개발자 모드 · 법적 고지</text>

  <!-- ===================== 좌: 폰 목업(콜아웃) ===================== -->
  <g transform="translate(28,82)">
    <rect x="0" y="0" width="300" height="452" rx="22" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
    <rect x="114" y="13" width="72" height="7" rx="3.5" fill="#e6e9ed"/>

    <!-- 앱바 -->
    <text x="150" y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#191f28">설정</text>
    <line x1="0" y1="64" x2="300" y2="64" stroke="#eef1f4" stroke-width="1"/>

    <!-- 프로필 카드 -->
    <rect x="14" y="76" width="272" height="62" rx="12" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="46" cy="107" r="20" fill="#3182f622"/>
    <text x="46" y="114" text-anchor="middle" font-size="22">🐰</text>
    <text x="76" y="101" font-size="13" font-weight="800" fill="#191f28">록빈</text>
    <text x="76" y="119" font-size="10.5" fill="#8b95a1">내 프로필</text>

    <!-- 정보 카드 -->
    <rect x="14" y="148" width="272" height="98" rx="12" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <text x="28" y="172" font-size="11" fill="#8b95a1">닉네임</text>
    <text x="272" y="172" text-anchor="end" font-size="11" font-weight="700" fill="#191f28">록빈</text>
    <line x1="28" y1="184" x2="272" y2="184" stroke="#f2f4f6" stroke-width="1"/>
    <text x="28" y="203" font-size="11" fill="#8b95a1">버전</text>
    <text x="272" y="203" text-anchor="end" font-size="11" font-weight="600" fill="#191f28">1.0.0</text>
    <line x1="28" y1="215" x2="272" y2="215" stroke="#f2f4f6" stroke-width="1"/>
    <text x="28" y="234" font-size="11" font-weight="600" fill="#3182f6">이모지 프로필 변경</text>
    <text x="272" y="234" text-anchor="end" font-size="12" fill="#8b95a1">›</text>

    <!-- 개발자 모드 토글 카드 -->
    <rect x="14" y="256" width="272" height="78" rx="12" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <text x="28" y="280" font-size="11.5" font-weight="800" fill="#191f28">🛠 개발자 모드</text>
    <rect x="240" y="268" width="32" height="18" rx="9" fill="#15c47e"/>
    <circle cx="263" cy="277" r="7" fill="#ffffff"/>
    <text x="28" y="301" font-size="10" fill="#8b95a1">FPS · 네트워크 · 손 스켈레톤 표시</text>
    <rect x="28" y="310" width="62" height="18" rx="6" fill="#f2f4f6"/>
    <text x="59" y="322" text-anchor="middle" font-size="9" fill="#6b7684">FPS</text>
    <rect x="96" y="310" width="74" height="18" rx="6" fill="#f2f4f6"/>
    <text x="133" y="322" text-anchor="middle" font-size="9" fill="#6b7684">네트워크</text>
    <rect x="176" y="310" width="94" height="18" rx="6" fill="#f2f4f6"/>
    <text x="223" y="322" text-anchor="middle" font-size="9" fill="#6b7684">손 스켈레톤</text>

    <!-- 법적 고지 카드 -->
    <rect x="14" y="344" width="272" height="58" rx="12" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <text x="28" y="366" font-size="11" font-weight="700" fill="#191f28">법적 고지 <tspan font-weight="500" fill="#8b95a1">(초안)</tspan></text>
    <text x="28" y="388" font-size="10" fill="#8b95a1">이용약관</text>
    <rect x="98" y="377" width="48" height="16" rx="6" fill="#f2f4f6"/>
    <text x="122" y="388" text-anchor="middle" font-size="8.5" fill="#8b95a1">준비 중</text>
    <text x="160" y="388" font-size="10" fill="#8b95a1">개인정보</text>
    <rect x="222" y="377" width="48" height="16" rx="6" fill="#f2f4f6"/>
    <text x="246" y="388" text-anchor="middle" font-size="8.5" fill="#8b95a1">준비 중</text>

    <!-- 홈으로 버튼 -->
    <rect x="14" y="410" width="272" height="30" rx="9" fill="#3182f6"/>
    <text x="150" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">🏠 홈으로</text>

    <!-- 이모지 선택 바텀시트(6열 그리드) -->
    <g transform="translate(200,148)">
      <rect x="0" y="0" width="96" height="98" rx="12" fill="#ffffff" stroke="#3182f6" stroke-width="1.4"/>
      <rect x="36" y="8" width="24" height="4" rx="2" fill="#e6e9ed"/>
      <text x="48" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#191f28">이모지 선택</text>
      <g font-size="13" text-anchor="middle">
        <text x="18" y="46">🐰</text><text x="34" y="46">🐱</text><text x="50" y="46">🐶</text><text x="66" y="46">🦊</text><text x="82" y="46">🐻</text><text x="98" y="46">🐼</text>
        <text x="18" y="64">🎹</text><text x="34" y="64">🎸</text><text x="50" y="64">🥁</text><text x="66" y="64">🎤</text><text x="82" y="64">🎧</text><text x="98" y="64">🎵</text>
        <text x="18" y="82">⭐</text><text x="34" y="82">🔥</text><text x="50" y="82">🌙</text><text x="66" y="82">🍀</text><text x="82" y="82">🌈</text><text x="98" y="82">💫</text>
      </g>
    </g>

    <!-- 콜아웃 배지 -->
    <g font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
      <circle cx="46" cy="107" r="11" fill="#ff6b6b"/><text x="46" y="111">1</text>
      <circle cx="150" cy="197" r="11" fill="#3182f6"/><text x="150" y="201">2</text>
      <circle cx="150" cy="277" r="11" fill="#ff6b6b"/><text x="150" y="281">3</text>
      <circle cx="150" cy="366" r="11" fill="#3182f6"/><text x="150" y="370">4</text>
    </g>
  </g>

  <!-- ===================== 우: 4단계 설명 ===================== -->
  <g transform="translate(360,86)">
    <!-- step 1 -->
    <g transform="translate(0,0)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">이모지 프로필</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">‘이모지 프로필 변경 ›’으로 아바타를 골라요. 고른 이모지가</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">커뮤니티 카드의 아바타에 그대로 표시돼요.</text>
    </g>
    <!-- step 2 -->
    <g transform="translate(0,72)">
      <circle cx="14" cy="14" r="13" fill="#3182f6"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">닉네임 · 버전 확인</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">정보 카드에서 내 닉네임과 앱 버전(1.0.0)을 확인해요.</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">문의나 버그 신고 시 이 버전을 알려 주세요.</text>
    </g>
    <!-- step 3 -->
    <g transform="translate(0,144)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">개발자 모드 (디버그)</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">🛠 토글을 켜면 FPS · 네트워크 · 손 스켈레톤이 화면에</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">떠요. 디버그 전용이라 평소엔 꺼 두면 돼요.</text>
    </g>
    <!-- step 4 -->
    <g transform="translate(0,216)">
      <circle cx="14" cy="14" r="13" fill="#3182f6"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">법적 고지는 준비 중</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">이용약관 · 개인정보는 ‘준비 중’ 초안이에요. 토스 익명</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">식별자만 사용하고, 별도 개인정보 수집은 없어요.</text>
    </g>

    <!-- 핵심 요약 띠 -->
    <g transform="translate(0,300)">
      <rect x="0" y="0" width="372" height="60" rx="12" fill="#eef5ff" stroke="#cfe0ff" stroke-width="1"/>
      <text x="16" y="23" font-size="11" font-weight="800" fill="#3182f6">핵심</text>
      <text x="16" y="41" font-size="11" fill="#3457d5">이모지 · 닉네임으로 내 프로필을 꾸미고,</text>
      <text x="16" y="55" font-size="11" fill="#3457d5">개발자 모드는 FPS · 네트워크 · 손 스켈레톤 디버그용이에요.</text>
    </g>
  </g>
</svg>
