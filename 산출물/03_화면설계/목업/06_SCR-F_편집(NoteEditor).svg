<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="375" height="812" fill="#f2f4f6"/>

  <!-- 상태바 -->
  <text x="20" y="27" font-size="12" fill="#8b95a1">9:41</text>

  <!-- Navigation 헤더 -->
  <text x="20" y="82" font-size="18" font-weight="700" fill="#191f28">편집</text>
  <text x="355" y="82" text-anchor="end" font-size="16" font-weight="700" fill="#3182f6">완료</text>

  <!-- 상단 안내 -->
  <text x="20" y="122" font-size="12" fill="#8b95a1">노트를 끌어 옮기고, 가장자리로 길이를 바꿔요</text>

  <!-- 피아노롤 카드 (자체 컴포넌트, 점선 외곽) -->
  <rect x="20" y="138" width="335" height="540" rx="18" fill="#ffffff" stroke="#3182f6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="34" y="160" font-size="11" font-weight="700" fill="#8b95a1">피아노롤 · 자체 컴포넌트</text>

  <!-- 롤 영역 좌표: x 32~343, y 172~666 -->
  <!-- 좌측 sticky 레인 라벨열 (width 44) -->
  <rect x="32" y="172" width="44" height="494" fill="#f9fafb"/>

  <!-- 레인 12개, 각 높이 ~41.1 (494/12) -->
  <!-- 그리드 우측 영역 x 76~343 -->

  <!-- 가로 마디선 (레인 구분, #e5e8eb) -->
  <g stroke="#e5e8eb" stroke-width="1">
    <line x1="76" y1="213.2" x2="343" y2="213.2"/>
    <line x1="76" y1="254.3" x2="343" y2="254.3"/>
    <line x1="76" y1="295.5" x2="343" y2="295.5"/>
    <line x1="76" y1="336.7" x2="343" y2="336.7"/>
    <line x1="76" y1="377.8" x2="343" y2="377.8"/>
    <line x1="76" y1="419.0" x2="343" y2="419.0"/>
    <line x1="76" y1="460.2" x2="343" y2="460.2"/>
    <line x1="76" y1="501.3" x2="343" y2="501.3"/>
    <line x1="76" y1="542.5" x2="343" y2="542.5"/>
    <line x1="76" y1="583.7" x2="343" y2="583.7"/>
    <line x1="76" y1="624.8" x2="343" y2="624.8"/>
  </g>

  <!-- 세로 박자선 (얇은) + 굵은 마디선 -->
  <g stroke="#e5e8eb" stroke-width="1">
    <line x1="109.4" y1="172" x2="109.4" y2="666"/>
    <line x1="142.8" y1="172" x2="142.8" y2="666"/>
    <line x1="209.6" y1="172" x2="209.6" y2="666"/>
    <line x1="243" y1="172" x2="243" y2="666"/>
    <line x1="309.8" y1="172" x2="309.8" y2="666"/>
  </g>
  <g stroke="#d1d6db" stroke-width="1.6">
    <line x1="176.2" y1="172" x2="176.2" y2="666"/>
    <line x1="276.4" y1="172" x2="276.4" y2="666"/>
  </g>

  <!-- 레인 라벨 음이름 (C5 B A G F E D C: 위에서 아래) 12px #8b95a1 -->
  <g font-size="12" fill="#8b95a1" text-anchor="middle">
    <text x="54" y="197">C5</text>
    <text x="54" y="238">B</text>
    <text x="54" y="279">A</text>
    <text x="54" y="320">G</text>
    <text x="54" y="361">F</text>
    <text x="54" y="403">E</text>
    <text x="54" y="444">D</text>
    <text x="54" y="485">C</text>
    <text x="54" y="526">B</text>
    <text x="54" y="567">A</text>
    <text x="54" y="608">G</text>
    <text x="54" y="649">C</text>
  </g>

  <!-- 노트 블록 -->
  <!-- 멜로디 블록 (파랑 #3182f6 rx6) 5개 -->
  <rect x="82" y="180" width="56" height="26" rx="6" fill="#3182f6"/>
  <rect x="148" y="262.5" width="40" height="26" rx="6" fill="#3182f6"/>
  <rect x="196" y="344.5" width="70" height="26" rx="6" fill="#3182f6"/>
  <rect x="118" y="426.8" width="48" height="26" rx="6" fill="#3182f6"/>

  <!-- 선택된 멜로디 블록 (외곽 2.5px 파랑 링 + 우측 3px 핸들) -->
  <rect x="230" y="221.4" width="66" height="26" rx="6" fill="#3182f6"/>
  <rect x="228.75" y="220.15" width="68.5" height="28.5" rx="7" fill="none" stroke="#3182f6" stroke-width="2.5"/>
  <rect x="295" y="225.4" width="3" height="18" rx="1.5" fill="#1b64da"/>

  <!-- 코드 블록 (violet #8b5cf6) 2개 -->
  <rect x="86" y="509.8" width="120" height="26" rx="6" fill="#8b5cf6"/>
  <rect x="216" y="591.0" width="100" height="26" rx="6" fill="#8b5cf6"/>

  <!-- 하단 편집 툴바 (가로 스크롤 느낌) -->
  <text x="20" y="708" font-size="12" font-weight="700" fill="#8b95a1">편집 도구</text>
  <g>
    <!-- ◀ -->
    <rect x="20" y="718" width="48" height="40" rx="999" fill="#f2f4f6"/>
    <text x="44" y="743" text-anchor="middle" font-size="15" fill="#4e5968">◀</text>
    <!-- ▶ -->
    <rect x="74" y="718" width="48" height="40" rx="999" fill="#f2f4f6"/>
    <text x="98" y="743" text-anchor="middle" font-size="15" fill="#4e5968">▶</text>
    <!-- ▲ 음 -->
    <rect x="128" y="718" width="66" height="40" rx="999" fill="#e8f1fd"/>
    <text x="161" y="743" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3182f6">▲ 음</text>
    <!-- ▼ 음 -->
    <rect x="200" y="718" width="66" height="40" rx="999" fill="#e8f1fd"/>
    <text x="233" y="743" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3182f6">▼ 음</text>
    <!-- ⏱ 맞춤 -->
    <rect x="272" y="718" width="80" height="40" rx="999" fill="#f2f4f6"/>
    <text x="312" y="743" text-anchor="middle" font-size="13.5" fill="#4e5968">⏱ 맞춤</text>
    <!-- 🗑 (살짝 잘려 가로 스크롤 느낌) -->
    <rect x="358" y="718" width="48" height="40" rx="999" fill="#f2f4f6"/>
    <text x="382" y="743" text-anchor="middle" font-size="15" fill="#ff6b6b">🗑</text>
  </g>

  <!-- 스크롤 인디케이터 -->
  <rect x="160" y="772" width="56" height="4" rx="2" fill="#d1d6db"/>
</svg>
