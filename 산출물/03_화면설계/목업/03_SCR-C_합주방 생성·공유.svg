<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="375" height="812" fill="#f2f4f6"/>

  <!-- 상태바 -->
  <text x="20" y="27" font-size="12" fill="#8b95a1" font-weight="600">9:41</text>

  <!-- Navigation -->
  <text x="20" y="82" font-size="15" fill="#4e5968" font-weight="500">‹ 스튜디오</text>
  <text x="187.5" y="82" font-size="18" font-weight="700" fill="#191f28" text-anchor="middle">공유하기</text>

  <!-- 저장 완료 카드 -->
  <rect x="20" y="112" width="335" height="78" fill="#ffffff" rx="18" stroke="#edf0f3" stroke-width="1"/>
  <text x="38" y="146" font-size="16" font-weight="700" fill="#191f28">내 곡이 저장됐어요 ✓</text>
  <text x="38" y="169" font-size="13" fill="#8b95a1">첫 합주 · 100BPM · 4마디</text>

  <!-- 공유 코드 카드 (강조) -->
  <rect x="20" y="202" width="335" height="134" fill="#ffffff" rx="18" stroke="#cfe0fb" stroke-width="1.5"/>
  <text x="187.5" y="268" font-size="30" font-weight="800" fill="#3182f6" letter-spacing="4" text-anchor="middle">AB12CD</text>
  <text x="187.5" y="304" font-size="13" fill="#8b95a1" text-anchor="middle">친구에게 이 코드를 공유하세요</text>

  <!-- 버튼 2개 가로 -->
  <rect x="20" y="350" width="161.5" height="52" fill="#3182f6" rx="16"/>
  <text x="100.75" y="382" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">코드 복사</text>

  <rect x="193.5" y="350" width="161.5" height="52" fill="#e8f1fd" rx="16"/>
  <text x="274.25" y="382" font-size="16" font-weight="700" fill="#3182f6" text-anchor="middle">링크 공유</text>

  <!-- 구분선 -->
  <line x1="20" y1="430" x2="355" y2="430" stroke="#e5e8eb" stroke-width="1"/>

  <!-- 받은 합주 섹션 -->
  <text x="20" y="464" font-size="14" font-weight="700" fill="#4e5968">받은 합주</text>

  <!-- 트랙 카드 -->
  <rect x="20" y="478" width="335" height="84" fill="#ffffff" rx="18" stroke="#edf0f3" stroke-width="1"/>
  <circle cx="58" cy="520" r="20" fill="#ff6b6b"/>
  <text x="58" y="525" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">토</text>
  <text x="92" y="514" font-size="15" font-weight="700" fill="#191f28">토스밴드님 트랙</text>
  <text x="92" y="535" font-size="13" fill="#8b95a1">4마디</text>
  <rect x="240" y="500" width="98" height="38" fill="#e8f1fd" rx="999"/>
  <text x="289" y="524" font-size="13" font-weight="700" fill="#3182f6" text-anchor="middle">내 연주에 얹기</text>

  <!-- 하단 상태칩 (코랄 외곽 점선) -->
  <rect x="105.5" y="744" width="164" height="40" fill="#ffffff" rx="999" stroke="#ff6b6b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="187.5" y="769" font-size="13" font-weight="600" fill="#ff6b6b" text-anchor="middle">업로드 실패 시 다시 시도</text>
</svg>
