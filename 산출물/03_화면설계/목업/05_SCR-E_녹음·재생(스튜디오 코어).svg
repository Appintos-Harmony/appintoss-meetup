<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="375" height="812" fill="#f2f4f6"/>

  <!-- Status bar -->
  <text x="20" y="27" font-size="12" fill="#8b95a1" font-weight="600">9:41</text>

  <!-- Navigation header -->
  <text x="20" y="82" font-size="18" font-weight="700" fill="#191f28">스튜디오</text>
  <text x="355" y="82" font-size="15" font-weight="600" fill="#4e5968" text-anchor="end">홈</text>

  <!-- Segment / Tab -->
  <rect x="20" y="108" width="335" height="44" rx="14" fill="#f2f4f6"/>
  <rect x="24" y="112" width="163.5" height="36" rx="11" fill="#ffffff"/>
  <text x="105.75" y="135" font-size="14.5" font-weight="700" fill="#191f28" text-anchor="middle">👋 제스처로 반주</text>
  <text x="269.25" y="135" font-size="14.5" font-weight="700" fill="#8b95a1" text-anchor="middle">👆 터치로 멜로디</text>

  <!-- Camera / Code-zone block (dark stage) -->
  <rect x="20" y="164" width="335" height="220" rx="18" fill="#333d4b"/>
  <!-- 4-split code zones -->
  <line x1="103.75" y1="164" x2="103.75" y2="384" stroke="#4e5968" stroke-width="1"/>
  <line x1="187.5" y1="164" x2="187.5" y2="384" stroke="#4e5968" stroke-width="1"/>
  <line x1="271.25" y1="164" x2="271.25" y2="384" stroke="#4e5968" stroke-width="1"/>
  <text x="61.9" y="320" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">G</text>
  <text x="145.6" y="320" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">D</text>
  <text x="229.4" y="320" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">C</text>
  <text x="313.1" y="320" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">Em</text>
  <!-- Camera PIP box (자체 컴포넌트 점선) -->
  <rect x="263" y="176" width="80" height="60" rx="10" fill="#191f28" fill-opacity="0.55" stroke="#8b95a1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="303" y="200" font-size="11" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">📷 카메라</text>
  <text x="303" y="218" font-size="11" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">손을 펴면 연주</text>
  <text x="32" y="184" font-size="11" fill="#ffffff" fill-opacity="0.55">코드존 · 자체 컴포넌트</text>

  <!-- Recording bar card -->
  <rect x="20" y="396" width="335" height="62" rx="18" fill="#ffffff" stroke="#edf0f3" stroke-width="1"/>
  <!-- record red dot -->
  <circle cx="46" cy="427" r="13" fill="#ff6b6b"/>
  <circle cx="46" cy="427" r="5" fill="#ffffff"/>
  <!-- replay (disabled) -->
  <text x="74" y="432" font-size="13" font-weight="600" fill="#b0b8c1">▶ 다시듣기</text>
  <!-- stop -->
  <text x="160" y="432" font-size="13" font-weight="600" fill="#4e5968">⏹ 정지</text>
  <!-- 4 beat dots -->
  <circle cx="226" cy="427" r="5" fill="#3182f6"/>
  <circle cx="244" cy="427" r="5" fill="#d1d6db"/>
  <circle cx="262" cy="427" r="5" fill="#d1d6db"/>
  <circle cx="280" cy="427" r="5" fill="#d1d6db"/>
  <!-- 녹음 중 -->
  <text x="343" y="432" font-size="13" font-weight="700" fill="#ff6b6b" text-anchor="end">녹음 중</text>

  <!-- 트랙 섹션 -->
  <text x="20" y="494" font-size="15" font-weight="700" fill="#191f28">트랙</text>

  <!-- Track row 1: 토스밴드 -->
  <rect x="20" y="506" width="335" height="64" rx="18" fill="#ffffff" stroke="#edf0f3" stroke-width="1"/>
  <circle cx="50" cy="538" r="20" fill="#ff6b6b"/>
  <text x="50" y="543" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">밴</text>
  <text x="82" y="534" font-size="14.5" font-weight="700" fill="#191f28">토스밴드</text>
  <text x="82" y="552" font-size="12" fill="#8b95a1">기본트랙</text>
  <text x="312" y="543" font-size="16" fill="#8b95a1" text-anchor="middle">🔇</text>
  <text x="339" y="543" font-size="16" fill="#8b95a1" text-anchor="middle">🗑</text>

  <!-- Track row 2: 나 -->
  <rect x="20" y="582" width="335" height="64" rx="18" fill="#ffffff" stroke="#edf0f3" stroke-width="1"/>
  <circle cx="50" cy="614" r="20" fill="#3182f6"/>
  <text x="50" y="619" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">나</text>
  <text x="82" y="610" font-size="14.5" font-weight="700" fill="#191f28">나</text>
  <text x="82" y="628" font-size="12" fill="#8b95a1">피아노</text>
  <text x="312" y="619" font-size="16" fill="#8b95a1" text-anchor="middle">🔇</text>
  <text x="339" y="619" font-size="16" fill="#8b95a1" text-anchor="middle">🗑</text>

  <!-- Bottom CTA -->
  <rect x="20" y="744" width="335" height="52" rx="16" fill="#3182f6"/>
  <text x="187.5" y="776" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">저장하고 공유</text>
</svg>
