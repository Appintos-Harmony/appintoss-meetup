<svg width="100%" viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img"><title>하모니 커뮤니티 도움말 가이드: 올리고, 가져와 쌓고, 한마디</title><desc>커뮤니티 화면(좌)에 번호 콜아웃을 달고, 우측에 6단계 사용법(올리기·둘러보기·들어보기 재생바·담기와 얹기·합주해서 올리기 출처·반응)을 설명하는 발표/도움말용 한 장. 기능명세서 v4와 커뮤니티 화면명세서 기준(as-built).</desc>

  <!-- 배경 -->
  <rect x="0" y="0" width="760" height="560" rx="18" fill="#f7f9fb"/>

  <!-- 제목 -->
  <text x="34" y="40" font-size="20" font-weight="800" fill="#191f28">하모니 커뮤니티 사용법</text>
  <text x="34" y="61" font-size="12.5" fill="#6b7684">음원을 올리고 · 가져와 쌓고 · 한마디 남기기</text>

  <!-- ===================== 좌: 폰 목업(콜아웃) ===================== -->
  <g transform="translate(28,82)">
    <rect x="0" y="0" width="300" height="452" rx="22" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
    <rect x="114" y="13" width="72" height="7" rx="3.5" fill="#e6e9ed"/>

    <!-- 앱바 -->
    <text x="18" y="48" font-size="12" fill="#8b95a1">‹ 스튜디오</text>
    <text x="150" y="48" text-anchor="middle" font-size="14" font-weight="800" fill="#191f28">커뮤니티</text>
    <text x="232" y="49" font-size="14" fill="#8b95a1">↻</text>
    <rect x="250" y="36" width="40" height="18" rx="9" fill="#3182f6"/>
    <text x="270" y="49" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">＋올리기</text>
    <line x1="0" y1="64" x2="300" y2="64" stroke="#eef1f4" stroke-width="1"/>

    <!-- 카드 1: 원곡 + 재생 바(재생 중) -->
    <rect x="14" y="76" width="272" height="128" rx="12" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="40" cy="104" r="16" fill="#3182f622"/>
    <text x="40" y="110" text-anchor="middle" font-size="18">🎹</text>
    <text x="64" y="100" font-size="12" font-weight="700" fill="#191f28">내 합주 <tspan font-weight="500" fill="#8b95a1">· 민혁</tspan></text>
    <text x="64" y="116" font-size="10" fill="#8b95a1">트랙 2개 · ▶ 62 · 이어 1</text>
    <!-- 버튼행 -->
    <rect x="16" y="128" width="92" height="26" rx="8" fill="#eef5ff" stroke="#3182f6" stroke-width="1.2"/>
    <text x="62" y="145" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3182f6">❚❚ 일시정지</text>
    <rect x="114" y="128" width="64" height="26" rx="8" fill="#f2f4f6"/>
    <text x="146" y="145" text-anchor="middle" font-size="10.5" font-weight="600" fill="#191f28">＋ 담기</text>
    <rect x="184" y="128" width="44" height="26" rx="8" fill="#ffecec"/>
    <text x="206" y="145" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ff6b6b">❤ 1</text>
    <rect x="234" y="128" width="38" height="26" rx="8" fill="#f2f4f6"/>
    <text x="253" y="145" text-anchor="middle" font-size="10.5" fill="#8b95a1">💬 0</text>
    <!-- 재생 바 -->
    <line x1="20" y1="178" x2="268" y2="178" stroke="#e6eaef" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="178" x2="150" y2="178" stroke="#3182f6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="178" r="7" fill="#ffffff" stroke="#3182f6" stroke-width="2.5"/>
    <text x="20" y="196" font-size="9" fill="#8b95a1">0:08</text>
    <text x="268" y="196" text-anchor="end" font-size="9" fill="#8b95a1">0:15</text>

    <!-- 카드 2: 파생곡(출처) -->
    <rect x="14" y="214" width="272" height="116" rx="12" fill="#ffffff" stroke="#eef1f4" stroke-width="1"/>
    <circle cx="40" cy="242" r="16" fill="#8b5cf622"/>
    <text x="40" y="248" text-anchor="middle" font-size="18">🐰</text>
    <text x="64" y="238" font-size="12" font-weight="700" fill="#191f28">내 합주 (이어 만든 곡) <tspan font-weight="500" fill="#8b95a1">· 록빈</tspan></text>
    <text x="64" y="254" font-size="10" fill="#8b95a1">트랙 3개 · ▶ 4 · 이어 0</text>
    <text x="64" y="270" font-size="10" fill="#8b5cf6">🎵 소스: 민혁님의 「내 합주」 음원 사용</text>
    <rect x="16" y="282" width="92" height="26" rx="8" fill="#f2f4f6"/>
    <text x="62" y="299" text-anchor="middle" font-size="10.5" font-weight="600" fill="#191f28">▶ 들어보기</text>
    <rect x="114" y="282" width="64" height="26" rx="8" fill="#f2f4f6"/>
    <text x="146" y="299" text-anchor="middle" font-size="10.5" font-weight="600" fill="#191f28">＋ 담기</text>
    <rect x="184" y="282" width="44" height="26" rx="8" fill="#f2f4f6"/>
    <text x="206" y="299" text-anchor="middle" font-size="10.5" fill="#8b95a1">🤍 0</text>
    <rect x="234" y="282" width="38" height="26" rx="8" fill="#f2f4f6"/>
    <text x="253" y="299" text-anchor="middle" font-size="10.5" fill="#8b95a1">💬 3</text>

    <!-- 하단 가져오기 바 -->
    <rect x="14" y="410" width="272" height="30" rx="9" fill="#3182f6"/>
    <text x="150" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">🎚 가져오기 (1개) → 스튜디오에 얹기</text>

    <!-- 콜아웃 배지 -->
    <g font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">
      <circle cx="270" cy="45" r="11" fill="#3182f6"/><text x="270" y="49">1</text>
      <circle cx="277" cy="90" r="11" fill="#3182f6"/><text x="277" y="94">2</text>
      <circle cx="150" cy="178" r="11" fill="#ff6b6b"/><text x="150" y="182">3</text>
      <circle cx="150" cy="425" r="11" fill="#ff6b6b"/><text x="150" y="429">4</text>
      <circle cx="160" cy="270" r="11" fill="#ff6b6b"/><text x="160" y="274">5</text>
      <circle cx="206" cy="141" r="11" fill="#ff6b6b"/><text x="206" y="145">6</text>
    </g>
  </g>

  <!-- ===================== 우: 6단계 설명 ===================== -->
  <g transform="translate(360,86)">
    <!-- step 1 -->
    <g transform="translate(0,0)">
      <circle cx="14" cy="14" r="13" fill="#3182f6"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">1</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">올리기</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">＋올리기 → 내 곡 선택. 같은 곡은 자동으로 한 번만</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">(중복 게시 방지). “이미 보드에 있어요” 안내.</text>
    </g>
    <!-- step 2 -->
    <g transform="translate(0,64)">
      <circle cx="14" cy="14" r="13" fill="#3182f6"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">2</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">둘러보기</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">보드에서 다른 사람 음원을. 카드에 작성자·트랙수·</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">재생수·이어(파생)수·좋아요·댓글이 보여요.</text>
    </g>
    <!-- step 3 -->
    <g transform="translate(0,128)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">3</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">들어보기 · 재생 바</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">▶ 누르면 재생 바가 떠요. ❚❚로 일시정지(위치 유지),</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">동그라미를 드래그하면 원하는 구간부터 들어요.</text>
    </g>
    <!-- step 4 -->
    <g transform="translate(0,192)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">4</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">담기 → 얹기</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">＋담기(여러 개 OK) 후 아래 “가져오기 → 스튜디오에</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">얹기”. 가져온 음원이 내 스튜디오에 레이어로 쌓여요.</text>
    </g>
    <!-- step 5 -->
    <g transform="translate(0,256)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">5</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">합주해서 올리기 · 출처</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">한 겹 녹음 후 다시 올리면 카드에 “🎵 소스: A님의</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">음원 사용”이 박히고, 원곡의 ‘이어(파생)수’가 +1.</text>
    </g>
    <!-- step 6 -->
    <g transform="translate(0,320)">
      <circle cx="14" cy="14" r="13" fill="#ff6b6b"/><text x="14" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">6</text>
      <text x="38" y="13" font-size="13.5" font-weight="800" fill="#191f28">반응 남기기</text>
      <text x="38" y="31" font-size="11" fill="#6b7684">❤ 좋아요는 다른 사람에게도 반영돼요. 💬 한마디도.</text>
      <text x="38" y="46" font-size="11" fill="#6b7684">부적절하면 신고: 여러 분이 신고하면 자동 숨김.</text>
    </g>

    <!-- 핵심 루프 요약 띠 -->
    <g transform="translate(0,388)">
      <rect x="0" y="0" width="372" height="44" rx="12" fill="#eef5ff" stroke="#cfe0ff" stroke-width="1"/>
      <text x="16" y="19" font-size="11" font-weight="800" fill="#3182f6">핵심 루프</text>
      <text x="16" y="36" font-size="11" fill="#3457d5">올리기 → 들어보기 → 담아 얹기 → 합주해서 올리기(출처) → 반응</text>
    </g>
  </g>
</svg>
