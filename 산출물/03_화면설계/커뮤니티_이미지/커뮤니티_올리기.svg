<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img"><title>하모니 커뮤니티 올리기 + 합주해서 올리기 화면 3단계 명세 (스케치·와이어프레임·목업)</title><desc>내 곡 올리기 시트(곡 목록 행 + 올리기 버튼)를 스케치, 와이어프레임, 목업 3단계로 표현. 목업 패널 상단에 출처 칩 'A의 여름밤 코드 위에 쌓는 중'과 하단 합주해서 올리기 파란 버튼 포함.</desc>

<!-- ===== 헤더 라벨 ===== -->
<text x="120" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#191f28">1 · 스케치</text>
<text x="340" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#191f28">2 · 와이어프레임</text>
<text x="560" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#191f28">3 · 목업</text>

<!-- ============================================================= -->
<!-- 패널 1 : 스케치 (펜슬 그레이 아웃라인, 저밀도)                 -->
<!-- ============================================================= -->
<g transform="translate(20,40)">
  <rect x="0" y="0" width="200" height="420" rx="20" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
  <rect x="76" y="12" width="48" height="6" rx="3" fill="#e6e9ed"/>

  <!-- 앱바: ‹ 스튜디오 / 커뮤니티 / + 올리기 -->
  <text x="16" y="44" font-size="11" fill="#9aa1ab">‹ 스튜디오</text>
  <rect x="120" y="34" width="64" height="16" rx="8" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>
  <text x="152" y="46" text-anchor="middle" font-size="11" fill="#9aa1ab">＋ 올리기</text>
  <line x1="14" y1="60" x2="186" y2="60" stroke="#dfe3e8" stroke-width="1"/>

  <!-- 시트 제목 -->
  <text x="16" y="80" font-size="11" fill="#9aa1ab">내 곡 올리기</text>

  <!-- 곡 목록 행 1 -->
  <rect x="16" y="92" width="100" height="11" rx="5" fill="#e9ecf0"/>
  <rect x="138" y="88" width="48" height="20" rx="10" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>
  <line x1="14" y1="120" x2="186" y2="120" stroke="#eef0f3" stroke-width="1"/>

  <!-- 곡 목록 행 2 -->
  <rect x="16" y="132" width="84" height="11" rx="5" fill="#e9ecf0"/>
  <rect x="138" y="128" width="48" height="20" rx="10" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>
  <line x1="14" y1="160" x2="186" y2="160" stroke="#eef0f3" stroke-width="1"/>

  <!-- 곡 목록 행 3 -->
  <rect x="16" y="172" width="110" height="11" rx="5" fill="#e9ecf0"/>
  <rect x="138" y="168" width="48" height="20" rx="10" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>

  <!-- 보드 카드 자리(저밀도) -->
  <rect x="16" y="214" width="168" height="74" rx="10" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>
  <circle cx="34" cy="234" r="11" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>
  <rect x="54" y="226" width="92" height="9" rx="4" fill="#e9ecf0"/>
  <rect x="54" y="241" width="64" height="8" rx="4" fill="#eef0f3"/>
  <rect x="24" y="262" width="46" height="16" rx="8" fill="none" stroke="#9aa1ab" stroke-width="1.1"/>
  <rect x="78" y="262" width="46" height="16" rx="8" fill="none" stroke="#9aa1ab" stroke-width="1.1"/>
  <rect x="132" y="262" width="34" height="16" rx="8" fill="none" stroke="#9aa1ab" stroke-width="1.1"/>

  <rect x="16" y="300" width="168" height="48" rx="10" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>

  <!-- 하단 가져오기 바 자리 -->
  <rect x="16" y="372" width="168" height="32" rx="10" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>
  <text x="100" y="392" text-anchor="middle" font-size="11" fill="#9aa1ab">가져오기 바</text>
</g>

<!-- ============================================================= -->
<!-- 패널 2 : 와이어프레임 (회색 채움 박스 + 보더 + 라벨)          -->
<!-- ============================================================= -->
<g transform="translate(240,40)">
  <rect x="0" y="0" width="200" height="420" rx="20" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
  <rect x="76" y="12" width="48" height="6" rx="3" fill="#e6e9ed"/>

  <!-- 앱바 -->
  <rect x="12" y="32" width="60" height="20" rx="6" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="42" y="46" text-anchor="middle" font-size="11" fill="#8b95a1">‹ 스튜디오</text>
  <rect x="120" y="32" width="64" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="152" y="46" text-anchor="middle" font-size="11" fill="#8b95a1">＋ 올리기</text>
  <line x1="12" y1="60" x2="188" y2="60" stroke="#dfe3e8" stroke-width="1"/>

  <!-- 올리기 시트 컨테이너 -->
  <rect x="12" y="68" width="176" height="132" rx="8" fill="#f7f9fb" stroke="#c4ccd4" stroke-width="1"/>
  <text x="22" y="86" font-size="11" font-weight="700" fill="#8b95a1">내 곡 올리기</text>

  <!-- 곡 행 1 -->
  <rect x="22" y="96" width="100" height="20" rx="4" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="28" y="110" font-size="11" fill="#8b95a1">곡 이름</text>
  <rect x="130" y="96" width="48" height="20" rx="10" fill="#e3e8ee" stroke="#c4ccd4" stroke-width="1"/>
  <text x="154" y="110" text-anchor="middle" font-size="11" fill="#8b95a1">올리기</text>

  <!-- 곡 행 2 -->
  <rect x="22" y="124" width="100" height="20" rx="4" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="28" y="138" font-size="11" fill="#8b95a1">곡 이름</text>
  <rect x="130" y="124" width="48" height="20" rx="10" fill="#e3e8ee" stroke="#c4ccd4" stroke-width="1"/>
  <text x="154" y="138" text-anchor="middle" font-size="11" fill="#8b95a1">올리기</text>

  <!-- 곡 행 3 -->
  <rect x="22" y="152" width="100" height="20" rx="4" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="28" y="166" font-size="11" fill="#8b95a1">곡 이름</text>
  <rect x="130" y="152" width="48" height="20" rx="10" fill="#e3e8ee" stroke="#c4ccd4" stroke-width="1"/>
  <text x="154" y="166" text-anchor="middle" font-size="11" fill="#8b95a1">올리는중</text>

  <text x="22" y="192" font-size="11" fill="#8b95a1">시트(publishOpen)</text>

  <!-- 출처 칩 자리 (와이어) -->
  <rect x="12" y="210" width="176" height="22" rx="11" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="100" y="225" text-anchor="middle" font-size="11" fill="#8b95a1">출처 칩 (origin)</text>

  <!-- 보드 카드 -->
  <rect x="12" y="240" width="176" height="78" rx="8" fill="#f7f9fb" stroke="#c4ccd4" stroke-width="1"/>
  <rect x="22" y="250" width="26" height="26" rx="13" fill="#e3e8ee" stroke="#c4ccd4" stroke-width="1"/>
  <rect x="56" y="252" width="96" height="10" rx="4" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <rect x="56" y="266" width="70" height="8" rx="4" fill="#eef1f4"/>
  <rect x="22" y="288" width="48" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="46" y="302" text-anchor="middle" font-size="11" fill="#8b95a1">들어보기</text>
  <rect x="76" y="288" width="44" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="98" y="302" text-anchor="middle" font-size="11" fill="#8b95a1">담기</text>
  <rect x="126" y="288" width="52" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <text x="152" y="302" text-anchor="middle" font-size="11" fill="#8b95a1">댓글</text>

  <!-- 합주해서 올리기 버튼 자리 -->
  <rect x="12" y="372" width="176" height="34" rx="10" fill="#e3e8ee" stroke="#c4ccd4" stroke-width="1.2"/>
  <text x="100" y="393" text-anchor="middle" font-size="11" font-weight="700" fill="#8b95a1">합주해서 올리기</text>
</g>

<!-- ============================================================= -->
<!-- 패널 3 : 목업 (실제 색·이모지·실제 카피)                       -->
<!-- ============================================================= -->
<g transform="translate(460,40)">
  <rect x="0" y="0" width="200" height="420" rx="20" fill="#f2f4f6" stroke="#c9ced5" stroke-width="1.5"/>
  <rect x="76" y="12" width="48" height="6" rx="3" fill="#e6e9ed"/>

  <!-- 앱바 -->
  <rect x="0" y="24" width="200" height="34" fill="#ffffff"/>
  <text x="12" y="46" font-size="11" fill="#8b95a1">‹ 스튜디오</text>
  <text x="92" y="46" font-size="12" font-weight="800" fill="#191f28">커뮤니티</text>
  <rect x="138" y="32" width="50" height="18" rx="9" fill="#eef4ff"/>
  <text x="163" y="45" text-anchor="middle" font-size="11" font-weight="700" fill="#3182f6">＋ 올리기</text>

  <!-- 출처 칩 (스튜디오 상단, 보라) -->
  <rect x="12" y="64" width="176" height="24" rx="12" fill="#f3effe"/>
  <text x="100" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#8b5cf6">🎵 A의 여름밤 코드 위에 쌓는 중</text>

  <!-- 내 곡 올리기 시트 (실제 카피) -->
  <rect x="12" y="96" width="176" height="118" rx="12" fill="#ffffff"/>
  <text x="22" y="115" font-size="12" font-weight="700" fill="#191f28">내 곡 올리기</text>

  <!-- 곡 행 1 -->
  <text x="22" y="138" font-size="12" fill="#191f28">여름밤 코드</text>
  <rect x="132" y="126" width="48" height="20" rx="10" fill="#eef4ff"/>
  <text x="156" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#3182f6">올리기</text>
  <line x1="22" y1="152" x2="178" y2="152" stroke="#eef0f3" stroke-width="1"/>

  <!-- 곡 행 2 -->
  <text x="22" y="170" font-size="12" fill="#191f28">새벽 비트</text>
  <rect x="132" y="158" width="48" height="20" rx="10" fill="#eef4ff"/>
  <text x="156" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#3182f6">올리기</text>
  <line x1="22" y1="184" x2="178" y2="184" stroke="#eef0f3" stroke-width="1"/>

  <!-- 곡 행 3 (올리는 중 상태) -->
  <text x="22" y="202" font-size="12" fill="#191f28">로파이 산책</text>
  <rect x="124" y="190" width="56" height="20" rx="10" fill="#e8eef7"/>
  <text x="152" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#8b95a1">올리는 중…</text>

  <!-- 보드 카드 (이모지 아바타 + 실제 카피 + 출처 크레딧) -->
  <rect x="12" y="222" width="176" height="118" rx="12" fill="#ffffff"/>
  <circle cx="34" cy="244" r="15" fill="#8b5cf622"/>
  <text x="34" y="250" text-anchor="middle" font-size="17">🎸</text>
  <text x="56" y="240" font-size="12" font-weight="700" fill="#191f28">여름밤 코드 <tspan fill="#8b95a1" font-weight="400">– A</tspan></text>
  <text x="56" y="254" font-size="11" fill="#8b95a1">트랙 3개 · ▶ 12 · 이어 1</text>
  <text x="56" y="268" font-size="11" fill="#8b5cf6">🎵 A님의 여름밤 코드 위에 쌓음</text>

  <!-- 액션 버튼 줄 -->
  <rect x="22" y="282" width="52" height="22" rx="11" fill="#f2f4f6"/>
  <text x="48" y="297" text-anchor="middle" font-size="11" fill="#191f28">▶ 들어보기</text>
  <rect x="80" y="282" width="44" height="22" rx="11" fill="#3182f6"/>
  <text x="102" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">✓ 담음</text>
  <rect x="130" y="282" width="22" height="22" rx="11" fill="#ffecec"/>
  <text x="141" y="298" text-anchor="middle" font-size="11" fill="#ff6b6b">❤️</text>
  <rect x="158" y="282" width="22" height="22" rx="11" fill="#f2f4f6"/>
  <text x="169" y="298" text-anchor="middle" font-size="11" fill="#8b95a1">💬</text>

  <!-- 메타 -->
  <text x="22" y="326" font-size="11" fill="#8b95a1">담아서 스튜디오에 레이어로</text>

  <!-- 합주해서 올리기 파란 버튼 (하단 고정) -->
  <rect x="12" y="370" width="176" height="38" rx="12" fill="#3182f6"/>
  <text x="100" y="394" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">🎚 합주해서 올리기</text>
</g>
</svg>