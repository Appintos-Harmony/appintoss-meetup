  <rect x="146" y="266" width="32" height="20" rx="6" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>

  <!-- 카드 3 부분 (스케치) -->
  <rect x="14" y="308" width="172" height="62" rx="10" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>
