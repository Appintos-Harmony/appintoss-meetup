<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img"><title>하모니 커뮤니티 보드: 스케치/와이어프레임/목업 3단계</title><desc>커뮤니티 음원 공유 보드 화면을 스케치, 와이어프레임, 목업 순으로 한 장에 그린 발표용 명세. 상단 앱바(‹ 스튜디오, 커뮤니티, ＋올리기)와 이모지 아바타 카드(음원명-작성자, 트랙·재생수·파생수 메타, 보라 출처줄, 들어보기·담기·댓글 버튼행)를 포함.</desc>

<!-- 헤더 라벨 -->
<text x="120" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#191f28">1 · 스케치</text>
<text x="340" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#191f28">2 · 와이어프레임</text>
<text x="560" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#191f28">3 · 목업</text>

