  <circle cx="33" cy="208" r="13" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
  <rect x="52" y="200" width="120" height="10" rx="3" fill="#eef1f4" stroke="#c4ccd4" stroke-width="0.8"/>
  <text x="55" y="208" font-size="8" fill="#8b95a1">음원명 · 작성자</text>
  <text x="52" y="226" font-size="9" fill="#8b95a1">트랙 N · ▶ 재생수 · 이어 파생수</text>
  <rect x="52" y="232" width="130" height="13" rx="4" fill="#f1ecfb" stroke="#cdbdf0" stroke-width="1"/>
  <text x="55" y="242" font-size="8" fill="#8b5cf6">🎵 출처: ○○의 △△ 위에 쌓음</text>
