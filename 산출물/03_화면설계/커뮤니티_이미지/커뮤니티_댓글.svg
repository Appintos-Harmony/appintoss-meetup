<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img"><title>하모니 커뮤니티 댓글 패널: 스케치·와이어프레임·목업 3단계</title><desc>커뮤니티 음원 카드 하단에 펼쳐진 댓글 패널. 작성자 굵게 + 회색 텍스트 + 우측 [신고], 하단 입력창 "한마디 남기기" + [보내기] 버튼을 스케치(저밀도 펜슬), 와이어프레임(회색 박스+라벨), 목업(실제 색·이모지·카피) 3단계로 제시.</desc>

  <!-- ===== 헤더 라벨 ===== -->
  <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#191f28">1 · 스케치</text>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#191f28">2 · 와이어프레임</text>
  <text x="560" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#191f28">3 · 목업</text>

  <!-- ============================================================ -->
  <!-- PANEL 1 · 스케치 (펜슬 그레이 아웃라인, 저밀도)               -->
  <!-- ============================================================ -->
  <g transform="translate(20,40)">
    <rect x="0" y="0" width="200" height="420" rx="20" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
    <rect x="76" y="12" width="48" height="6" rx="3" fill="#e6e9ed"/>

    <!-- 카드 상단: 아바타 동그라미 + 제목/메타 플레이스홀더 -->
    <circle cx="34" cy="52" r="13" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>
    <rect x="56" y="44" width="92" height="7" rx="3.5" fill="#e6e9ed"/>
    <rect x="56" y="57" width="64" height="6" rx="3" fill="#eef1f4"/>

    <!-- 액션 버튼 줄(들어보기/담기/♡/💬) 윤곽만 -->
    <rect x="16" y="80" width="50" height="18" rx="9" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>
    <rect x="72" y="80" width="50" height="18" rx="9" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>
    <rect x="128" y="80" width="26" height="18" rx="9" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>
    <rect x="160" y="80" width="26" height="18" rx="9" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>

    <!-- 댓글 패널 구분선 -->
    <line x1="16" y1="112" x2="184" y2="112" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- 댓글 항목 1: 작성자 표시 + 텍스트 바 + 우측 신고 -->
    <rect x="16" y="124" width="40" height="6" rx="3" fill="#dfe3e8"/>
    <rect x="16" y="135" width="104" height="6" rx="3" fill="#eef1f4"/>
    <rect x="158" y="124" width="26" height="14" rx="7" fill="none" stroke="#9aa1ab" stroke-width="1.2"/>

    <!-- 댓글 항목 2 -->
    <rect x="16" y="156" width="34" height="6" rx="3" fill="#dfe3e8"/>
    <rect x="16" y="167" width="120" height="6" rx="3" fill="#eef1f4"/>
    <rect x="158" y="156" width="26" height="14" rx="7" fill="none" stroke="#9aa1ab" stroke-width="1.2"/>

    <!-- 댓글 항목 3 -->
    <rect x="16" y="188" width="44" height="6" rx="3" fill="#dfe3e8"/>
    <rect x="16" y="199" width="88" height="6" rx="3" fill="#eef1f4"/>
    <rect x="158" y="188" width="26" height="14" rx="7" fill="none" stroke="#9aa1ab" stroke-width="1.2"/>

    <!-- 하단 입력창 + 보내기 -->
    <rect x="16" y="378" width="120" height="26" rx="8" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>
    <rect x="40" y="388" width="64" height="6" rx="3" fill="#eef1f4"/>
    <rect x="142" y="378" width="42" height="26" rx="8" fill="none" stroke="#9aa1ab" stroke-width="1.5"/>

    <text x="100" y="240" text-anchor="middle" font-size="11" fill="#9aa1ab">댓글 목록 + 신고</text>
    <text x="100" y="362" text-anchor="middle" font-size="11" fill="#9aa1ab">입력 + 보내기</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL 2 · 와이어프레임 (회색 채움 박스 + 보더 + 라벨)         -->
  <!-- ============================================================ -->
  <g transform="translate(240,40)">
    <rect x="0" y="0" width="200" height="420" rx="20" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
    <rect x="76" y="12" width="48" height="6" rx="3" fill="#e6e9ed"/>

    <!-- 카드 상단 영역 -->
    <rect x="16" y="38" width="168" height="34" rx="8" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <rect x="22" y="46" width="18" height="18" rx="9" fill="#dfe3e8"/>
    <rect x="48" y="46" width="86" height="8" rx="4" fill="#dfe3e8"/>
    <rect x="48" y="58" width="56" height="6" rx="3" fill="#e6e9ed"/>

    <!-- 액션 버튼 줄 -->
    <rect x="16" y="78" width="48" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="40" y="92" text-anchor="middle" font-size="11" fill="#8b95a1">들어보기</text>
    <rect x="68" y="78" width="40" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="88" y="92" text-anchor="middle" font-size="11" fill="#8b95a1">담기</text>
    <rect x="112" y="78" width="32" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="128" y="92" text-anchor="middle" font-size="11" fill="#8b95a1">♡</text>
    <rect x="148" y="78" width="36" height="20" rx="10" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="166" y="92" text-anchor="middle" font-size="11" fill="#8b95a1">💬</text>

    <!-- 댓글 패널 구분선 + 라벨 -->
    <line x1="16" y1="110" x2="184" y2="110" stroke="#c4ccd4" stroke-width="1"/>
    <text x="16" y="124" font-size="11" fill="#8b95a1">댓글</text>

    <!-- 댓글 항목 1 (작성자 라벨 + 텍스트 박스 + 신고 박스) -->
    <text x="16" y="142" font-size="11" font-weight="700" fill="#8b95a1">작성자</text>
    <rect x="56" y="133" width="74" height="10" rx="3" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <rect x="150" y="132" width="34" height="16" rx="8" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="167" y="143" text-anchor="middle" font-size="10" fill="#8b95a1">신고</text>

    <!-- 댓글 항목 2 -->
    <text x="16" y="166" font-size="11" font-weight="700" fill="#8b95a1">작성자</text>
    <rect x="56" y="157" width="86" height="10" rx="3" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <rect x="150" y="156" width="34" height="16" rx="8" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="167" y="167" text-anchor="middle" font-size="10" fill="#8b95a1">신고</text>

    <!-- 댓글 항목 3 -->
    <text x="16" y="190" font-size="11" font-weight="700" fill="#8b95a1">작성자</text>
    <rect x="56" y="181" width="62" height="10" rx="3" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <rect x="150" y="180" width="34" height="16" rx="8" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="167" y="191" text-anchor="middle" font-size="10" fill="#8b95a1">신고</text>

    <!-- 하단 입력 행 -->
    <rect x="16" y="376" width="120" height="28" rx="8" fill="#eef1f4" stroke="#c4ccd4" stroke-width="1"/>
    <text x="24" y="394" font-size="11" fill="#8b95a1">입력 placeholder</text>
    <rect x="142" y="376" width="42" height="28" rx="8" fill="#dfe3e8" stroke="#c4ccd4" stroke-width="1"/>
    <text x="163" y="394" text-anchor="middle" font-size="11" fill="#8b95a1">보내기</text>
  </g>

  <!-- ============================================================ -->
  <!-- PANEL 3 · 목업 (실제 색·이모지·카피)                          -->
  <!-- ============================================================ -->
  <g transform="translate(460,40)">
    <rect x="0" y="0" width="200" height="420" rx="20" fill="#ffffff" stroke="#c9ced5" stroke-width="1.5"/>
    <rect x="76" y="12" width="48" height="6" rx="3" fill="#e6e9ed"/>

    <!-- 카드 상단: 이모지 아바타 + 음원명·작성자 + 메타 + 출처 -->
    <circle cx="32" cy="50" r="15" fill="#3182f622"/>
    <text x="32" y="56" text-anchor="middle" font-size="17">🎵</text>
    <text x="54" y="46" font-size="12" font-weight="700" fill="#191f28">여름밤 코드 <tspan font-weight="500" fill="#8b95a1">· 소정</tspan></text>
    <text x="54" y="60" font-size="11" fill="#8b95a1">트랙 3개 · ▶ 41 · 이어 2</text>
    <text x="54" y="73" font-size="11" fill="#8b5cf6">🎵 록빈님의 비 위에 쌓음</text>

    <!-- 액션 버튼 줄 -->
    <rect x="16" y="84" width="56" height="22" rx="11" fill="#f2f4f6"/>
    <text x="44" y="99" text-anchor="middle" font-size="11" fill="#191f28">▶ 들어보기</text>
    <rect x="76" y="84" width="44" height="22" rx="11" fill="#3182f6"/>
    <text x="98" y="99" text-anchor="middle" font-size="11" fill="#ffffff">＋ 담기</text>
    <rect x="124" y="84" width="34" height="22" rx="11" fill="#ffecec"/>
    <text x="141" y="99" text-anchor="middle" font-size="11" fill="#ff6b6b">❤️ 7</text>
    <rect x="162" y="84" width="22" height="22" rx="11" fill="#f2f4f6"/>
    <text x="173" y="99" text-anchor="middle" font-size="11" fill="#8b95a1">💬</text>

    <!-- 댓글 패널 구분선 -->
    <line x1="16" y1="118" x2="184" y2="118" stroke="#e6e9ed" stroke-width="1"/>

    <!-- 댓글 1 -->
    <text x="16" y="138" font-size="11"><tspan font-weight="700" fill="#191f28">민혁</tspan> <tspan fill="#8b95a1">베이스 라인 너무 좋아요</tspan></text>
    <rect x="150" y="128" width="34" height="16" rx="8" fill="#f2f4f6"/>
    <text x="167" y="139" text-anchor="middle" font-size="10" fill="#8b95a1">신고</text>

    <!-- 댓글 2 -->
    <text x="16" y="162" font-size="11"><tspan font-weight="700" fill="#191f28">상혁</tspan> <tspan fill="#8b95a1">여기에 드럼 얹어볼게요🥁</tspan></text>
    <rect x="150" y="152" width="34" height="16" rx="8" fill="#f2f4f6"/>
    <text x="167" y="163" text-anchor="middle" font-size="10" fill="#8b95a1">신고</text>

    <!-- 댓글 3 -->
    <text x="16" y="186" font-size="11"><tspan font-weight="700" fill="#191f28">록빈</tspan> <tspan fill="#8b95a1">후렴 보이싱 굿👏</tspan></text>
    <rect x="150" y="176" width="34" height="16" rx="8" fill="#f2f4f6"/>
    <text x="167" y="187" text-anchor="middle" font-size="10" fill="#8b95a1">신고</text>

    <!-- 하단 입력창 + 보내기 -->
    <rect x="16" y="376" width="120" height="28" rx="8" fill="#ffffff" stroke="#c9ced5" stroke-width="1"/>
    <text x="25" y="394" font-size="11" fill="#8b95a1">한마디 남기기</text>
    <rect x="142" y="376" width="42" height="28" rx="8" fill="#3182f6"/>
    <text x="163" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">보내기</text>
  </g>
</svg>