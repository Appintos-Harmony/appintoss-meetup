<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- 앱인토스 정책: 핀치줌 비활성화(심사 반려 사유 회피) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>핸드 제스처 악기: 스파이크</title>
  <style>
    :root { --blue:#3182f6; --bg:#0b0d12; --line:#2a2f3a; --text:#f2f4f6; --sub:#8b95a1; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, sans-serif; }
    #stage { position:relative; width:100vw; height:100vh; overflow:hidden; }
    video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      transform: scaleX(-1); /* 셀카 미러 */ }
    #zones { position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; pointer-events:none; }
    .zone { border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
      font-size:13vw; font-weight:800; color:rgba(255,255,255,.18); transition:.12s; }
    .zone.on { background:rgba(49,130,246,.28); color:#fff; }
    #hud { position:absolute; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg, transparent, rgba(0,0,0,.78)); pointer-events:none; }
    #status { font-size:13px; color:var(--sub); margin-bottom:10px; line-height:1.5; }
    #status b { color:var(--text); }
    .row { display:flex; gap:8px; pointer-events:auto; }
    button { flex:1; padding:14px 10px; border:0; border-radius:14px; font-size:15px; font-weight:700;
      background:#1b2027; color:var(--text); }
    button.primary { background:var(--blue); }
    button:disabled { opacity:.45; }
    #start { position:absolute; inset:0; margin:auto; width:78vw; max-width:320px; height:56px; border-radius:16px;
      background:var(--blue); font-size:17px; font-weight:800; z-index:5; }
    #log { position:absolute; top:8px; left:8px; right:8px; font-size:11px; color:var(--sub); white-space:pre-wrap; z-index:6; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline webkit-playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="zones">
      <div class="zone" data-i="0">C</div>
      <div class="zone" data-i="1">G</div>
      <div class="zone" data-i="2">Am</div>
      <div class="zone" data-i="3">F</div>
    </div>
    <div id="log"></div>
    <button id="start">▶ 시작 (카메라 + 소리 허용)</button>
    <div id="hud">
      <div id="status">대기 중…</div>
      <div class="row">
        <button id="rec">● 녹화</button>
        <button id="play" disabled>▶ 재생</button>
        <button id="clear" disabled>지우기</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script type="module">
    import { HandLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const $ = (s) => document.querySelector(s);
    const video = $('#cam'), canvas = $('#overlay'), ctx = canvas.getContext('2d');
    const zoneEls = [...document.querySelectorAll('.zone')];
    const statusEl = $('#status'), logEl = $('#log');
    const CHORDS = {
      0: { name:'C',  notes:['C4','E4','G4'] },
      1: { name:'G',  notes:['G3','B3','D4'] },
      2: { name:'Am', notes:['A3','C4','E4'] },
      3: { name:'F',  notes:['F3','A3','C4'] },
    };
    const FINGERS = [[8,6],[12,10],[16,14],[20,18]]; // [tip, pip]
    const log = (m) => { logEl.textContent = m; };

    let landmarker = null, synth = null, raf = 0;
    let curZone = -1, playing = false;            // 현재 울리는 코드 존
    let recording = false, events = [], recStart = 0;
    let frames = 0, fps = 0, lastFpsT = 0;

    function openFingers(lm) {
      // tip 이 pip 보다 위(y 작음)면 폄: 직립 손 기준 간이 판정
      let n = 0; for (const [t,p] of FINGERS) if (lm[t].y < lm[p].y) n++; return n;
    }
    function zoneOf(lm) {
      // 손바닥 중심(9번) → 미러 화면 기준 사분면
      const x = 1 - lm[9].x, y = lm[9].y;
      return (x < .5 ? 0 : 1) + (y < .5 ? 0 : 2); // 0:TL 1:TR 2:BL 3:F(BR)
    }
    function attack(zone) {
      if (playing && curZone === zone) return;
      if (playing) synth.triggerRelease(CHORDS[curZone].notes);
      synth.triggerAttack(CHORDS[zone].notes);
      curZone = zone; playing = true;
      zoneEls.forEach((e,i)=>e.classList.toggle('on', i===zone));
      if (recording) events.push({ t: performance.now()-recStart, type:'on', zone });
    }
    function release() {
      if (!playing) return;
      synth.triggerRelease(CHORDS[curZone].notes);
      if (recording) events.push({ t: performance.now()-recStart, type:'off', zone:curZone });
      playing = false; curZone = -1; zoneEls.forEach(e=>e.classList.remove('on'));
    }

    function draw(hands) {
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight; // 매 프레임 재할당 방지(성능)
      }
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for (const lm of hands) {
        ctx.fillStyle = '#39d98a';
        for (const p of lm) { ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, 6, 0, 7); ctx.fill(); }
      }
    }

    function loop() {
      raf = requestAnimationFrame(loop);
      if (!landmarker || video.readyState < 2) return;
      const res = landmarker.detectForVideo(video, performance.now());
      const hands = res.landmarks || [];
      draw(hands);
      if (hands.length) {
        const lm = hands[0], open = openFingers(lm);
        if (open >= 3) attack(zoneOf(lm)); else release();
      } else release();
      // fps
      frames++; const now = performance.now();
      if (now - lastFpsT > 500) { fps = Math.round(frames*1000/(now-lastFpsT)); frames=0; lastFpsT=now; }
      statusEl.innerHTML = `손 <b>${hands.length}</b> · FPS <b>${fps}</b> · 코드 <b>${playing?CHORDS[curZone].name:'-'}</b> · 녹화 ${recording?'<b>ON</b>':'off'} · 이벤트 <b>${events.length}</b>`;
    }

    async function start() {
      try {
        $('#start').disabled = true; log('오디오 시작…');
        await Tone.start();
        synth = new Tone.PolySynth(Tone.Synth, { envelope:{ attack:.01, release:.4 } }).toDestination();
        synth.volume.value = -8;
        log('카메라 요청…');
        const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:480, height:360 }, audio:false });
        video.srcObject = stream; await video.play();
        log('모델 로드…(수 초)');
        const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        landmarker = await HandLandmarker.createFromOptions(fileset, {
          baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
          runningMode:"VIDEO", numHands:1,
        });
        $('#start').style.display='none'; log(''); loop();
      } catch (e) {
        $('#start').disabled = false;
        log('실패: ' + (e && e.name ? e.name+' · ': '') + (e && e.message ? e.message: e) +
            '\n(카메라 권한/HTTPS·localhost 필요. 토스 WebView면 getUserMedia 미지원일 수 있음 = 핵심 확인 포인트)');
      }
    }

    // 녹화/재생(이벤트 기반)
    $('#rec').onclick = () => {
      recording = !recording;
      $('#rec').textContent = recording ? '■ 정지' : '● 녹화';
      $('#rec').classList.toggle('primary', recording);
      if (recording) { events = []; recStart = performance.now(); }
      else { $('#play').disabled = !events.length; $('#clear').disabled = !events.length; }
    };
    $('#play').onclick = () => {
      if (!events.length) return;
      release();
      for (const ev of events) setTimeout(() => {
        if (ev.type==='on') {
          if (playing) synth.triggerRelease(CHORDS[curZone].notes);
          synth.triggerAttack(CHORDS[ev.zone].notes); curZone=ev.zone; playing=true;
          zoneEls.forEach((e,i)=>e.classList.toggle('on', i===ev.zone));
        } else { synth.triggerRelease(CHORDS[ev.zone].notes); playing=false; curZone=-1; zoneEls.forEach(e=>e.classList.remove('on')); }
      }, ev.t);
      const end = events[events.length-1].t + 200;
      setTimeout(() => { zoneEls.forEach(e=>e.classList.remove('on')); }, end);
    };
    $('#clear').onclick = () => { events=[]; $('#play').disabled=true; $('#clear').disabled=true; };
    $('#start').onclick = start;
  </script>
</body>
</html>
