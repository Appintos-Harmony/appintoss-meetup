<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B6CB0" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E5FAE" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71B7FF"/>
      <stop offset="1" stop-color="#3478F6"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80E8CF"/>
      <stop offset="1" stop-color="#2FC3A1"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ED6FF"/>
      <stop offset="1" stop-color="#5BA6F7"/>
    </linearGradient>
  </defs>

  <!-- White canvas -->
  <rect width="600" height="600" fill="#FFFFFF"/>

  <!-- Rounded app tile -->
  <rect x="42" y="42" width="516" height="516" rx="126" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="42.75" y="42.75" width="514.5" height="514.5" rx="125.25" fill="none" stroke="#E3EFFB" stroke-width="1.5"/>

  <!-- Quiet halo -->
  <circle cx="300" cy="302" r="183" fill="#F8FBFF"/>
  <circle cx="300" cy="302" r="160" fill="#FCFEFF" stroke="#EDF5FD" stroke-width="2"/>

  <!-- Subtle speech bubble motif -->
  <g opacity="0.9">
    <path d="M130 176c0-26 21-47 47-47h73c26 0 47 21 47 47v28c0 26-21 47-47 47h-43l-26 22 5-22h-9c-26 0-47-21-47-47z"
          fill="#EFF7FF" stroke="#DCEEFF" stroke-width="3"/>
    <circle cx="179" cy="190" r="7" fill="#D4E9FD"/>
    <circle cx="213" cy="190" r="7" fill="#D4E9FD"/>
    <circle cx="247" cy="190" r="7" fill="#D4E9FD"/>
  </g>

  <!-- Subtle calendar motif -->
  <g opacity="0.95">
    <rect x="357" y="356" width="126" height="116" rx="30" fill="#F0FCF8" stroke="#DDF6EE" stroke-width="3"/>
    <rect x="357" y="356" width="126" height="34" rx="18" fill="#E4F8F1"/>
    <rect x="382" y="341" width="12" height="31" rx="6" fill="#C9EFE3"/>
    <rect x="446" y="341" width="12" height="31" rx="6" fill="#C9EFE3"/>
    <circle cx="391" cy="416" r="7" fill="#D2F2E8"/>
    <circle cx="420" cy="416" r="7" fill="#D2F2E8"/>
    <circle cx="449" cy="416" r="7" fill="#D2F2E8"/>
    <circle cx="391" cy="444" r="7" fill="#D2F2E8"/>
    <circle cx="420" cy="444" r="7" fill="#D2F2E8"/>
  </g>

  <!-- Main community mark: three abstract people forming a circle -->
  <g filter="url(#softShadow)">
    <!-- Bodies: rounded geometric arcs -->
    <path d="M238.4 236.8 A91 91 0 0 1 361.6 236.8"
          fill="none" stroke="url(#blueGrad)" stroke-width="58" stroke-linecap="round"/>
    <path d="M382.8 315.7 A91 91 0 0 1 321.2 422.5"
          fill="none" stroke="url(#skyGrad)" stroke-width="58" stroke-linecap="round"/>
    <path d="M278.8 422.5 A91 91 0 0 1 217.2 315.7"
          fill="none" stroke="url(#mintGrad)" stroke-width="58" stroke-linecap="round"/>

    <!-- Heads -->
    <circle cx="300" cy="173" r="32" fill="url(#blueGrad)"/>
    <circle cx="410" cy="365" r="32" fill="url(#skyGrad)"/>
    <circle cx="190" cy="365" r="32" fill="url(#mintGrad)"/>

    <!-- Tiny highlights for a friendly dimensional feel -->
    <circle cx="289" cy="163" r="8" fill="#FFFFFF" opacity="0.32"/>
    <circle cx="399" cy="355" r="8" fill="#FFFFFF" opacity="0.30"/>
    <circle cx="179" cy="355" r="8" fill="#FFFFFF" opacity="0.30"/>
  </g>

  <!-- Clean central negative-space hub -->
  <circle cx="300" cy="326" r="67" fill="#FFFFFF"/>
  <circle cx="300" cy="326" r="67" fill="none" stroke="#F0F6FC" stroke-width="2"/>

  <!-- Three tiny connection dots, reinforcing the circle -->
  <circle cx="300" cy="258" r="7" fill="#DDEBFF"/>
  <circle cx="359" cy="360" r="7" fill="#DDEBFF"/>
  <circle cx="241" cy="360" r="7" fill="#DDF5ED"/>
</svg>
