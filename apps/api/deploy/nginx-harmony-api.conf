# /etc/nginx/sites-available/harmony-api → sites-enabled 심볼릭 링크
# TLS: sudo certbot --nginx -d 3.39.167.74.nip.io  (nip.io = IP 기반 무료 도메인, 토스 WebView HTTPS 충족)
server {
  listen 80;
  server_name 3.39.167.74.nip.io;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
