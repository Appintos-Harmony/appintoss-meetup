# 한 도메인에서 미니앱(정적) + API(프록시) 동시 서빙. TLS=certbot(3.39.167.74.nip.io).
server {
  listen 80;
  server_name 3.39.167.74.nip.io;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  server_name 3.39.167.74.nip.io;
  ssl_certificate /etc/letsencrypt/live/3.39.167.74.nip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/3.39.167.74.nip.io/privkey.pem;

  # API → harmony-api(:8080). 클라이언트가 보낸 X-Forwarded-For를 이어붙이지 않고 실제 TCP 피어($remote_addr)로
  # X-Real-IP·X-Forwarded-For를 덮어쓴다 → 앱(TRUST_PROXY=1)이 위조 불가한 IP로 레이트리밋(Codex P0).
  location = /healthz   { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
  location = /community { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
  location /sessions    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }

  # 미니앱(SPA) 정적
  root /opt/harmony-web;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}
