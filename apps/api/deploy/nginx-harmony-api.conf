# 한 도메인에서 미니앱(정적) + API(프록시) 동시 서빙. TLS=certbot(3.39.167.74.nip.io).
server {
  listen 80;
  server_name 3.39.167.74.nip.io;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  server_name 3.39.167.74.nip.io;
  ssl_certificate /etc/letsencrypt/live/3.39.167.74.nip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/3.39.167.74.nip.io/privkey.pem;

  # API → harmony-api(:8080). X-Forwarded-For 전달 = server.mjs IP 레이트리밋이 프록시 뒤에서도 동작(없으면 모든 IP가 127.0.0.1로 뭉침).
  location = /healthz   { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /community { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /sessions    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

  # 미니앱(SPA) 정적
  root /opt/harmony-web;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}
