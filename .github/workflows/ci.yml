name: ci

on:
  push:
  pull_request:

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 문서·링크·작업지시서·비밀값 검증
        run: node tooling/scripts/검증_전체.mjs
  # 코드 게이트 + 루프 엔진 테스트. branch protection의 required status check 대상.
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: apps/miniapp 의존성 설치
        run: npm ci
        working-directory: apps/miniapp
      - name: 코드 게이트(tsc + vitest) + 문서 검증
        run: node tooling/scripts/검증_전체.mjs --code
      - name: 루프 엔진 단위테스트
        run: node tooling/scripts/루프엔진_검증.mjs
