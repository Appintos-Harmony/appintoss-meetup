name: ci

on:
  push:
  pull_request:

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 문서·링크·작업지시서·비밀값 검증
        run: node tooling/scripts/검증_전체.mjs
